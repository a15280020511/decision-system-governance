name: One-Time Control Plane Key Permission Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/control-plane-key-permission-diagnostic.yml"

permissions:
  contents: read

jobs:
  verify-control-plane-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
    steps:
      - name: Verify token can read, create and close non-business Issues
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("CONTROL_PLANE_TOKEN", "").strip()
          if not token:
              raise SystemExit("CONTROL_PLANE_TOKEN is missing or empty")

          repositories = (
              "a15280020511/evidence-data-center",
              "a15280020511/compute-simulation-center",
              "a15280020511/expert-assessment-center",
          )

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "governance-key-permission-diagnostic",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:1000]
                  raise SystemExit(
                      f"{method} {path} failed with HTTP {exc.code}: {body}"
                  ) from exc
              return json.loads(raw) if raw else {}

          results = []
          for repository in repositories:
              metadata = request("GET", f"/repos/{repository}")
              if metadata.get("full_name") != repository:
                  raise SystemExit(f"unexpected repository metadata for {repository}")

              issue = request(
                  "POST",
                  f"/repos/{repository}/issues",
                  {
                      "title": "[permission-test] CONTROL_PLANE_TOKEN diagnostic",
                      "body": (
                          "One-time permission diagnostic. This title does not match any "
                          "business ticket prefix and must not trigger business execution."
                      ),
                  },
              )
              number = int(issue["number"])
              closed = request(
                  "PATCH",
                  f"/repos/{repository}/issues/{number}",
                  {"state": "closed", "state_reason": "not_planned"},
              )
              if closed.get("state") != "closed":
                  raise SystemExit(f"failed to close diagnostic Issue in {repository}")
              results.append(
                  {
                      "repository": repository,
                      "read": "PASS",
                      "issues_write": "PASS",
                      "diagnostic_issue": number,
                      "cleanup": "closed_not_planned",
                  }
              )

          print(json.dumps({"status": "PASS", "results": results}, ensure_ascii=False))
          PY
