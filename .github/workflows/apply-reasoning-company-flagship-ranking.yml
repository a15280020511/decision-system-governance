name: Apply Reasoning Company Flagship Ranking

on:
  push:
    branches:
      - fix/reasoning-company-flagship-ranking

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/reasoning-company-flagship-ranking
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Patch selector and frozen contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {text.count(old)}")
              return text.replace(old, new)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return updated

          selector_path = Path("governance-copilot/select_expert_team_plan.py")
          selector = selector_path.read_text(encoding="utf-8")
          selector = replace_once(
              selector,
              "Selection remains deliberately simple: use OpenRouter's official intelligence\norder as the eligibility ceiling, retain explicit paid flagship tiers, verify a\nreal exact provider endpoint for the current task, sort by combined token price,\nkeep only the cheapest qualified flagship from each company, and use the first\nfour companies as active experts plus the next four companies as ordered standbys.",
              "Selection remains deliberately simple: read OpenRouter's live official\nintelligence order, retain paid general-purpose models that explicitly support\nreasoning, keep only the highest-intelligence eligible reasoning model from each\ncompany as that company's flagship, verify a real exact provider endpoint, then\nsort those company flagships by combined token price. The first four are active\nexperts and the next four are ordered standbys.",
              "selector docstring",
          )
          selector = replace_once(
              selector,
              'SELECTOR_SCHEMA_VERSION = "governance-openrouter-executable-flagship-price-v4"',
              'SELECTOR_SCHEMA_VERSION = "governance-openrouter-company-top-reasoning-price-v5"',
              "selector schema",
          )
          selector = sub_once(
              selector,
              r'FLAGSHIP_TIER = re\.compile\(.*?\n\)\nEXCLUDED_TIER = re\.compile\(',
              'REASONING_PARAMETER = "reasoning"\nCOMPANY_FLAGSHIP_BASIS = (\n    "highest-official-intelligence-ranked-eligible-reasoning-model-per-company"\n)\nREASONING_CAPABILITY_SOURCE = (\n    "openrouter-models-api-supported-parameters-or-reasoning-metadata"\n)\nEXCLUDED_TIER = re.compile(',
              "replace name-based flagship constants",
          )
          selector = sub_once(
              selector,
              r'def _is_general_flagship\(identity: str\) -> bool:\n.*?\n\ndef _catalog_candidates',
              '''def _reasoning_evidence(row: Mapping[str, Any]) -> str:\n    supported = row.get("supported_parameters")\n    if isinstance(supported, list):\n        normalized = {str(value).strip().casefold() for value in supported}\n        if REASONING_PARAMETER in normalized:\n            return "models-api-supported-parameter-reasoning"\n    if isinstance(row.get("reasoning"), Mapping):\n        return "models-api-reasoning-metadata"\n    return ""\n\n\ndef _is_general_reasoning_model(row: Mapping[str, Any], identity: str) -> bool:\n    lowered = identity.lower()\n    return bool(\n        _reasoning_evidence(row)\n        and not EXCLUDED_TIER.search(identity)\n        and not any(marker in lowered for marker in SPECIALIZED_MARKERS)\n    )\n\n\ndef _catalog_candidates''',
              "reasoning eligibility functions",
          )
          selector = sub_once(
              selector,
              r'def _catalog_candidates\(payload: Mapping\[str, Any\]\) -> list\[dict\[str, Any\]\]:\n.*?\n\ndef _endpoint_url',
              '''def _catalog_candidates(payload: Mapping[str, Any]) -> list[dict[str, Any]]:\n    rows = payload.get("data")\n    if not isinstance(rows, list) or not rows:\n        raise ExpertPlanError("OpenRouter model catalog is empty")\n\n    company_flagships: dict[str, dict[str, Any]] = {}\n    seen: set[str] = set()\n    for official_rank, row in enumerate(rows, 1):\n        if official_rank > OFFICIAL_INTELLIGENCE_RANK_LIMIT:\n            break\n        if not isinstance(row, Mapping):\n            continue\n        model_id = str(row.get("id") or "").strip()\n        if not _stable_model_id(model_id) or model_id in seen:\n            continue\n        seen.add(model_id)\n        company = model_id.split("/", 1)[0].casefold()\n        if company in company_flagships:\n            continue\n        if not _is_general_text(row) or not _not_expired(row):\n            continue\n        identity = _identity(row, model_id)\n        if not _is_general_reasoning_model(row, identity):\n            continue\n\n        pricing = _mapping(row.get("pricing"))\n        prompt = _price_per_million(pricing, "prompt")\n        completion = _price_per_million(pricing, "completion")\n        if prompt is None or completion is None or prompt + completion <= 0:\n            continue\n\n        combined = prompt + completion\n        company_flagships[company] = {\n            "model_id": model_id,\n            "company": company,\n            "official_intelligence_rank": official_rank,\n            "context_length": _positive_int(row.get("context_length")),\n            "max_completion_tokens": _positive_int(\n                row.get("max_completion_tokens")\n            ),\n            "prompt_usd_per_million": prompt,\n            "completion_usd_per_million": completion,\n            "request_usd": _request_price(pricing),\n            "price_rank_usd_per_million": combined,\n            "estimated_task_cost_usd": combined,\n            "reasoning_capable": True,\n            "reasoning_evidence": _reasoning_evidence(row),\n            "flagship_basis": COMPANY_FLAGSHIP_BASIS,\n        }\n\n    candidates = list(company_flagships.values())\n    candidates.sort(\n        key=lambda row: (\n            float(row["price_rank_usd_per_million"]),\n            float(row["request_usd"]),\n            float(row["prompt_usd_per_million"]),\n            float(row["completion_usd_per_million"]),\n            int(row["official_intelligence_rank"]),\n            str(row["model_id"]),\n        )\n    )\n    if not candidates:\n        raise ExpertPlanError(\n            "no paid general-purpose reasoning company flagship is available within "\n            "the official intelligence top 1000"\n        )\n    return candidates\n\n\ndef _endpoint_url''',
              "company reasoning flagship catalog",
          )
          selector = replace_once(
              selector,
              'raise ExpertPlanError("ranked model has no executable endpoint qualification")\n    try:',
              'raise ExpertPlanError("ranked model has no executable endpoint qualification")\n    if row.get("reasoning_capable") is not True:\n        raise ExpertPlanError("ranked model is not reasoning-capable")\n    if str(row.get("reasoning_evidence") or "").strip() == "":\n        raise ExpertPlanError("ranked model lacks OpenRouter reasoning evidence")\n    if row.get("flagship_basis") != COMPANY_FLAGSHIP_BASIS:\n        raise ExpertPlanError("ranked model is not the company reasoning flagship")\n    try:',
              "finite cost reasoning contract",
          )
          selector = sub_once(
              selector,
              r'def _model_record\(row: Mapping\[str, Any\], \*, slot: int\) -> dict\[str, Any\]:\n.*?\n\ndef _catalog_sha256',
              '''def _model_record(row: Mapping[str, Any], *, slot: int) -> dict[str, Any]:\n    return {\n        "slot": slot,\n        "model": str(row["model_id"]),\n        "company": str(row["company"]),\n        "estimated_task_cost_usd": _finite_cost(row),\n        "price_rank_usd_per_million": float(row["price_rank_usd_per_million"]),\n        "prompt_usd_per_million": float(row["prompt_usd_per_million"]),\n        "completion_usd_per_million": float(row["completion_usd_per_million"]),\n        "official_intelligence_rank": int(row["official_intelligence_rank"]),\n        "qualified_provider_count": int(row["qualified_provider_count"]),\n        "endpoint_inventory_sha256": str(row["endpoint_inventory_sha256"]),\n        "reasoning_capable": True,\n        "reasoning_evidence": str(row["reasoning_evidence"]),\n        "flagship_basis": str(row["flagship_basis"]),\n        "selection_evidence": (\n            "company-top-intelligence-reasoning-model+price-order+"\n            "live-exact-endpoint-qualified"\n        ),\n    }\n\n\ndef _catalog_sha256''',
              "model record reasoning evidence",
          )
          selector = replace_once(
              selector,
              '            "minimum_completion_tokens": row["minimum_completion_tokens"],\n',
              '            "minimum_completion_tokens": row["minimum_completion_tokens"],\n            "reasoning_capable": row["reasoning_capable"],\n            "reasoning_evidence": row["reasoning_evidence"],\n            "flagship_basis": row["flagship_basis"],\n',
              "catalog digest reasoning fields",
          )
          selector = replace_once(
              selector,
              '            "openrouter-official-intelligence-top-1000 -> paid-general-purpose-"\n            "flagships -> live-exact-endpoint-qualified -> combined-token-price-"\n            "ascending -> cheapest-qualified-model-per-company -> "\n            "eight-distinct-companies -> four-primary-four-recovery"',
              '            "openrouter-live-intelligence-high-to-low -> paid-general-purpose-"\n            "reasoning-capable -> highest-ranked-reasoning-model-per-company -> "\n            "live-exact-endpoint-qualified -> combined-token-price-ascending -> "\n            "eight-distinct-companies -> four-primary-four-recovery"',
              "selector policy",
          )
          selector = replace_once(
              selector,
              '        "price_rank_basis": "prompt_usd_per_million + completion_usd_per_million",\n',
              '        "price_rank_basis": "prompt_usd_per_million + completion_usd_per_million",\n        "reasoning_model_required": True,\n        "reasoning_capability_source": REASONING_CAPABILITY_SOURCE,\n        "flagship_definition": COMPANY_FLAGSHIP_BASIS,\n        "catalog_sort": "intelligence-high-to-low",\n',
              "plan reasoning metadata",
          )
          selector = replace_once(
              selector,
              '        "company_model_policy": "one-cheapest-qualified-flagship-per-company",',
              '        "company_model_policy": COMPANY_FLAGSHIP_BASIS,',
              "company flagship policy",
          )
          selector_path.write_text(selector, encoding="utf-8")

          envelope_path = Path("governance-copilot/expert_task_envelope.py")
          envelope = envelope_path.read_text(encoding="utf-8")
          envelope = replace_once(
              envelope,
              'SCHEMA_VERSION = "governance-expert-task-envelope-v6"',
              'SCHEMA_VERSION = "governance-expert-task-envelope-v7"',
              "envelope schema",
          )
          envelope = replace_once(
              envelope,
              '    "governance-openrouter-live-unique-company-flagship-price-v7"',
              '    "governance-openrouter-company-top-reasoning-price-v8"',
              "ZDR selector schema",
          )
          envelope = replace_once(
              envelope,
              '                    "explicit-product-tier-price-order+live-exact-endpoint-qualified+"\n                    "authenticated-zdr-endpoint-qualified+minimum-one-zdr-provider-route"',
              '                    "company-top-intelligence-reasoning-model+price-order+"\n                    "live-exact-endpoint-qualified+authenticated-zdr-endpoint-qualified+"\n                    "minimum-one-zdr-provider-route"',
              "ZDR selection evidence",
          )
          envelope = replace_once(
              envelope,
              '                "openrouter-official-intelligence-top-1000 -> paid-general-purpose-"\n                "flagships -> live-exact-endpoint-qualified -> authenticated-zdr-"\n                "endpoint-qualified -> minimum-one-zdr-provider-route -> combined-token-"\n                "price-ascending -> cheapest-qualified-model-per-company -> "\n                "eight-distinct-companies -> four-primary-four-recovery"',
              '                "openrouter-live-intelligence-high-to-low -> paid-general-purpose-"\n                "reasoning-capable -> highest-ranked-reasoning-model-per-company -> "\n                "live-exact-endpoint-qualified -> authenticated-zdr-endpoint-qualified -> "\n                "minimum-one-zdr-provider-route -> combined-token-price-ascending -> "\n                "eight-distinct-companies -> four-primary-four-recovery"',
              "frozen selection policy",
          )
          envelope_path.write_text(envelope, encoding="utf-8")

          signer_path = Path("tools/sign_expert_plan.py")
          signer = signer_path.read_text(encoding="utf-8")
          signer = replace_once(
              signer,
              '    if plan.get("expert_center_reranking_allowed") is not False:\n        raise ExpertPlanSigningError("expert center reranking must be disabled")\n',
              '    if plan.get("expert_center_reranking_allowed") is not False:\n        raise ExpertPlanSigningError("expert center reranking must be disabled")\n    if plan.get("reasoning_model_required") is not True:\n        raise ExpertPlanSigningError("reasoning model requirement is missing")\n    expected_flagship = (\n        "highest-official-intelligence-ranked-eligible-reasoning-model-per-company"\n    )\n    if plan.get("flagship_definition") != expected_flagship:\n        raise ExpertPlanSigningError("company reasoning flagship definition mismatch")\n',
              "signer plan reasoning contract",
          )
          signer = replace_once(
              signer,
              '            evidence = str(row.get("selection_evidence") or "")\n',
              '            evidence = str(row.get("selection_evidence") or "")\n            reasoning_evidence = str(row.get("reasoning_evidence") or "").strip()\n',
              "signer row reasoning evidence",
          )
          signer = replace_once(
              signer,
              '            if (\n                isinstance(provider_count, bool)',
              '            if row.get("reasoning_capable") is not True:\n                raise ExpertPlanSigningError("expert model is not reasoning-capable")\n            if not reasoning_evidence:\n                raise ExpertPlanSigningError("expert model lacks reasoning evidence")\n            if row.get("flagship_basis") != expected_flagship:\n                raise ExpertPlanSigningError("expert model is not its company reasoning flagship")\n            if (\n                isinstance(provider_count, bool)',
              "signer row reasoning checks",
          )
          signer_path.write_text(signer, encoding="utf-8")

          repair_path = Path("tools/repair_expert_child_plan.py")
          repair = repair_path.read_text(encoding="utf-8")
          repair = replace_once(
              repair,
              '    selected_rows = list(plan.get("selected_models") or [])\n',
              '    if plan.get("reasoning_model_required") is not True:\n        raise ExpertChildRepairError("reasoning model requirement is missing")\n    expected_flagship = (\n        "highest-official-intelligence-ranked-eligible-reasoning-model-per-company"\n    )\n    if plan.get("flagship_definition") != expected_flagship:\n        raise ExpertChildRepairError("company reasoning flagship definition mismatch")\n\n    selected_rows = list(plan.get("selected_models") or [])\n',
              "repair plan reasoning contract",
          )
          repair = replace_once(
              repair,
              '            provider_count = row.get("qualified_provider_count")\n',
              '            provider_count = row.get("qualified_provider_count")\n            reasoning_evidence = str(row.get("reasoning_evidence") or "").strip()\n',
              "repair row reasoning evidence",
          )
          repair = replace_once(
              repair,
              '            if (\n                isinstance(provider_count, bool)',
              '            if row.get("reasoning_capable") is not True:\n                raise ExpertChildRepairError("regenerated model is not reasoning-capable")\n            if not reasoning_evidence:\n                raise ExpertChildRepairError("regenerated model lacks reasoning evidence")\n            if row.get("flagship_basis") != expected_flagship:\n                raise ExpertChildRepairError("regenerated model is not its company reasoning flagship")\n            if (\n                isinstance(provider_count, bool)',
              "repair row reasoning checks",
          )
          repair_path.write_text(repair, encoding="utf-8")
          PY

      - name: Patch deterministic tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          basis = "highest-official-intelligence-ranked-eligible-reasoning-model-per-company"

          strict_path = Path("tests/test_expert_plan_strict_flagship_policy.py")
          text = strict_path.read_text(encoding="utf-8")
          text = text.replace(
              '    max_completion_tokens: int = 8_192,\n) -> dict[str, object]:',
              '    max_completion_tokens: int = 8_192,\n    reasoning: bool = True,\n) -> dict[str, object]:',
          )
          text = text.replace(
              '        "architecture": {\n            "input_modalities": ["text"],\n            "output_modalities": ["text"],\n        },\n',
              '        "architecture": {\n            "input_modalities": ["text"],\n            "output_modalities": ["text"],\n        },\n        "supported_parameters": ["reasoning"] if reasoning else ["max_tokens"],\n        "reasoning": {"default_enabled": True} if reasoning else None,\n',
          )
          text = text.replace(
              '        "flagship_basis": "explicit-product-tier",\n        "exact_endpoint_qualified": True,',
              f'        "flagship_basis": "{basis}",\n        "reasoning_capable": True,\n        "reasoning_evidence": "models-api-supported-parameter-reasoning",\n        "exact_endpoint_qualified": True,',
          )
          pattern = r'    def test_catalog_keeps_strict_candidates_across_top_1000\(self\) -> None:\n.*?\n    def test_company_selection_keeps_only_one_model_per_company'
          replacement = '''    def test_catalog_selects_company_top_reasoning_model_before_price_sort(self) -> None:\n        rows = [\n            model("openai/gpt-5.6-sol-pro", 2.0, 8.0),\n            model("openai/gpt-5.6-luna-pro", 0.1, 0.6),\n            model("anthropic/claude-opus", 3.0, 15.0),\n            model("vendor/frontier-reasoner", 1.0, 2.0),\n            model("vendor/cheap-pro", 0.2, 0.4),\n            model("other/nonreasoning-pro", 0.01, 0.01, reasoning=False),\n            model("small/mini-reasoner", 0.01, 0.01),\n        ]\n        rows.extend(\n            model(f"filler/model-{index}", 9.0, 9.0, reasoning=False)\n            for index in range(7, 1000)\n        )\n        rows.append(model("late/too-late-reasoner", 0.01, 0.01))\n\n        filtered = planner._catalog_candidates({"data": rows})\n        ids = [row["model_id"] for row in filtered]\n\n        self.assertIn("openai/gpt-5.6-sol-pro", ids)\n        self.assertNotIn("openai/gpt-5.6-luna-pro", ids)\n        self.assertIn("anthropic/claude-opus", ids)\n        self.assertIn("vendor/frontier-reasoner", ids)\n        self.assertNotIn("vendor/cheap-pro", ids)\n        self.assertNotIn("other/nonreasoning-pro", ids)\n        self.assertNotIn("small/mini-reasoner", ids)\n        self.assertNotIn("late/too-late-reasoner", ids)\n        self.assertEqual(\n            ids,\n            [\n                "vendor/frontier-reasoner",\n                "openai/gpt-5.6-sol-pro",\n                "anthropic/claude-opus",\n            ],\n        )\n        self.assertTrue(all(row["reasoning_capable"] for row in filtered))\n        self.assertTrue(\n            all(row["flagship_basis"] == planner.COMPANY_FLAGSHIP_BASIS for row in filtered)\n        )\n\n    def test_name_pro_alone_does_not_make_a_model_eligible(self) -> None:\n        filtered = planner._catalog_candidates(\n            {"data": [model("vendor/cheap-pro", 0.1, 0.2, reasoning=False)]}\n        )\n        self.assertEqual(filtered, [])\n\n    def test_company_selection_keeps_only_one_model_per_company'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("failed to replace strict catalog test")
          text = text.replace(
              '        self.assertIn("live-exact-endpoint-qualified", plan["selection_policy"])\n',
              '        self.assertIn("reasoning-capable", plan["selection_policy"])\n        self.assertIn("highest-ranked-reasoning-model-per-company", plan["selection_policy"])\n        self.assertIn("live-exact-endpoint-qualified", plan["selection_policy"])\n',
          )
          text = text.replace(
              '            "cheapest-qualified-model-per-company",\n',
              '            "highest-ranked-reasoning-model-per-company",\n',
          )
          text = text.replace(
              '        self.assertNotIn("natural_high", source)\n',
              '        self.assertNotIn("natural_high", source)\n        self.assertNotIn("FLAGSHIP_TIER", source)\n        self.assertIn("reasoning_model_required", source)\n',
          )
          strict_path.write_text(text, encoding="utf-8")

          for filename in (
              "tests/test_eight_model_ordered_recovery.py",
              "tests/test_expert_zdr_endpoint_parity.py",
          ):
              path = Path(filename)
              value = path.read_text(encoding="utf-8")
              value = value.replace(
                  '        "flagship_basis": "explicit-product-tier",\n',
                  f'        "flagship_basis": "{basis}",\n        "reasoning_capable": True,\n        "reasoning_evidence": "models-api-supported-parameter-reasoning",\n',
              )
              value = value.replace(
                  'qualified("openai/gpt-5.6-luna-pro", 251, 0.7, 2)',
                  'qualified("openai/gpt-5.6-sol-pro", 5, 2.5, 2)',
              )
              value = value.replace(
                  '"openai/gpt-5.6-luna-pro",\n',
                  '"openai/gpt-5.6-sol-pro",\n',
              )
              path.write_text(value, encoding="utf-8")

          repair_test = Path("tests/test_expert_child_plan_repair.py")
          value = repair_test.read_text(encoding="utf-8")
          value = value.replace(
              '                "endpoint_inventory_sha256": hashlib.sha256(\n                    company.encode("utf-8")\n                ).hexdigest(),\n',
              f'                "endpoint_inventory_sha256": hashlib.sha256(\n                    company.encode("utf-8")\n                ).hexdigest(),\n                "reasoning_capable": True,\n                "reasoning_evidence": "models-api-supported-parameter-reasoning",\n                "flagship_basis": "{basis}",\n',
          )
          value = value.replace(
              '        "minimum_native_completion_tokens": 1024,\n',
              f'        "minimum_native_completion_tokens": 1024,\n        "reasoning_model_required": True,\n        "flagship_definition": "{basis}",\n',
          )
          repair_test.write_text(value, encoding="utf-8")

          preview_test = Path("tests/test_expert_plan_preview_workflow.py")
          value = preview_test.read_text(encoding="utf-8")
          value = value.replace(
              '            "model does not satisfy the qualified ZDR provider floor",\n',
              '            "model does not satisfy the qualified ZDR provider floor",\n            "reasoning model requirement is missing",\n            "expert model is not reasoning-capable",\n            "company reasoning flagship definition mismatch",\n',
          )
          preview_test.write_text(value, encoding="utf-8")
          PY

      - name: Run targeted zero-call tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_zdr_endpoint_parity \
            tests.test_expert_child_plan_repair \
            tests.test_expert_plan_preview_workflow -v

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-reasoning-company-flagship-ranking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance-copilot tools tests .github/workflows
          git commit -m "fix: select company flagship reasoning models"
          git push origin HEAD:fix/reasoning-company-flagship-ranking
