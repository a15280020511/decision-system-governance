name: Execute Benchmarked Reasoning Flagships V3

on:
  push:
    branches:
      - fix/benchmarked-reasoning-company-flagships

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/benchmarked-reasoning-company-flagships
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply staged patch
        run: |
          set -euo pipefail
          python tools/_apply_benchmarked_reasoning_flagship_patch.py
      - name: Correct algorithm and deterministic fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          path = Path("governance-copilot/select_paid_governance_flagship_model.py")
          text = path.read_text(encoding="utf-8")
          topology = "\n".join((
              '    eligible_by_company: dict[str, list[dict[str, Any]]] = defaultdict(list)',
              '    for row in eligible:',
              '        eligible_by_company[str(row["company"])].append(row)',
              '',
              '    high_by_company: dict[str, list[dict[str, Any]]] = defaultdict(list)',
              '    globally_high_ids = {str(row["model_id"]) for row in globally_high}',
              '    for row in globally_high:',
              '        high_by_company[str(row["company"])].append(row)',
              '',
              '    flagship_ids: set[str] = set()',
              '    company_evidence: dict[str, Any] = {}',
              '    for company, high_rows in high_by_company.items():',
              '        company_rows = eligible_by_company[company]',
              '        strict = [row for row in high_rows if row["strict_product_tier"]]',
              '        if len(company_rows) == 1:',
              '            chosen = strict',
              '            company_evidence[company] = {',
              '                "eligible_count": 1,',
              '                "eligible_high_count": len(high_rows),',
              '                "method": "singleton-requires-strict-product-tier",',
              '            }',
              '        else:',
              '            assignments, lower_center, flagship_center = _natural_high(',
              '                [float(row["balanced_score"]) for row in company_rows]',
              '            )',
              '            natural_top = [',
              '                row',
              '                for row, is_high in zip(company_rows, assignments)',
              '                if is_high and str(row["model_id"]) in globally_high_ids',
              '            ]',
              '            chosen_by_id = {',
              '                str(row["model_id"]): row for row in natural_top + strict',
              '            }',
              '            chosen = list(chosen_by_id.values())',
              '            company_evidence[company] = {',
              '                "eligible_count": len(company_rows),',
              '                "eligible_high_count": len(high_rows),',
              '                "lower_center": lower_center,',
              '                "flagship_center": flagship_center,',
              '                "method": "company-natural-top-plus-strict-product-tier",',
              '            }',
              '        for row in chosen:',
              '            flagship_ids.add(str(row["model_id"]))',
              '',
              '    pre_specialization_flagships =',
          ))
          text = sub_once(
              text,
              r'    by_company: dict\[str, list\[dict\[str, Any\]\]\] = defaultdict\(list\)\n.*?    pre_specialization_flagships =',
              topology,
              "company natural-top topology",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_expert_plan_strict_flagship_policy.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"openai/gpt-5.6-terra": 89,', '"openai/gpt-5.6-terra": 70,', 1)
          text = text.replace('"deepseek/deepseek-v4-pro": 86,', '"deepseek/deepseek-v4-pro": 90,', 1)
          luna_test = "\n".join((
              '    def test_luna_pro_is_rejected_even_without_another_openai_model(self) -> None:',
              '        rows = [',
              '            model("openai/gpt-5.6-luna-pro", 0.1, 0.6),',
              '            model("other/reasoning-max", 0.2, 0.4),',
              '            model("third/reasoning-pro", 0.3, 0.5),',
              '        ]',
              '        scores = {row["id"]: 90 for row in rows}',
              '        filtered = planner._catalog_candidates(',
              '            {"data": rows}, benchmark_payload(scores)',
              '        )',
              '        self.assertNotIn(',
              '            "openai/gpt-5.6-luna-pro",',
              '            [row["model_id"] for row in filtered],',
              '        )',
              '',
          ))
          text = sub_once(
              text,
              r'    def test_luna_pro_is_rejected_even_without_another_openai_model\(self\) -> None:\n.*?(?=    def test_non_reasoning_pro_model_is_rejected)',
              luna_test,
              "Luna test fixture",
          )
          nonreasoning_test = "\n".join((
              '    def test_non_reasoning_pro_model_is_rejected(self) -> None:',
              '        rows = [',
              '            model("vendor/cheap-pro", 0.01, 0.02, reasoning=False),',
              '            model("other/reasoning-max", 0.2, 0.4),',
              '            model("third/reasoning-pro", 0.3, 0.5),',
              '        ]',
              '        scores = {row["id"]: 90 for row in rows}',
              '        filtered = planner._catalog_candidates(',
              '            {"data": rows}, benchmark_payload(scores)',
              '        )',
              '        self.assertNotIn(',
              '            "vendor/cheap-pro",',
              '            [row["model_id"] for row in filtered],',
              '        )',
              '',
          ))
          text = sub_once(
              text,
              r'    def test_non_reasoning_pro_model_is_rejected\(self\) -> None:\n.*?(?=    def test_economy_and_specialized_models_are_rejected)',
              nonreasoning_test,
              "non-reasoning test fixture",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_eight_model_ordered_recovery.py")
          text = path.read_text(encoding="utf-8")
          helper = "\n".join((
              'def qualified(',
              '    model_id: str,',
              '    rank: int,',
              '    price: float,',
              '    providers: int = 1,',
              '    basis: str = "strict-product-tier",',
              ') -> dict:',
              '    return {',
              '        "model_id": model_id,',
              '        "company": model_id.split("/", 1)[0],',
              '        "official_intelligence_rank": rank,',
              '        "context_length": 131_072,',
              '        "max_completion_tokens": 8_192,',
              '        "prompt_usd_per_million": price / 3,',
              '        "completion_usd_per_million": price * 2 / 3,',
              '        "request_usd": 0.0,',
              '        "price_rank_usd_per_million": price,',
              '        "estimated_task_cost_usd": price,',
              '        "flagship_verified": True,',
              '        "flagship_basis": basis,',
              '        "company_flagship_method": "fixture-company-top",',
              '        "benchmark_source": "artificial-analysis-via-openrouter",',
              '        "intelligence_index": 50.0,',
              '        "coding_index": 50.0,',
              '        "agentic_index": 50.0,',
              '        "balanced_score": 50.0,',
              '        "benchmark_evidence_sha256": hashlib.sha256(',
              '            (model_id + "-benchmark").encode()',
              '        ).hexdigest(),',
              '        "exact_endpoint_qualified": True,',
              '        "zdr_endpoint_qualified": True,',
              '        "qualified_provider_count": providers,',
              '        "endpoint_inventory_sha256": hashlib.sha256(model_id.encode()).hexdigest(),',
              '        "required_context_tokens": 16_384,',
              '        "minimum_completion_tokens": 1_024,',
              '    }',
              '',
          ))
          text = sub_once(
              text,
              r'def qualified\(.*?\n\n(?=class EightCompanyOrderedRecoveryTests)',
              helper,
              "eight-model helper",
          )
          price_test = "\n".join((
              '    def test_live_price_ranking_contains_one_model_per_company(self) -> None:',
              '        selector = load_selector()',
              '        rows = [',
              '            qualified("nex-agi/nex-n2-pro", 28, 1.25),',
              '            qualified("deepseek/deepseek-v4-pro", 23, 1.305, 8),',
              '            qualified("xiaomi/mimo-v2.5-pro", 25, 1.305, 2),',
              '            qualified("minimax/minimax-m3", 30, 1.5, 2, "company-local-natural-top-layer"),',
              '            qualified("amazon/nova-pro-v1", 129, 4.0, 2),',
              '            qualified("nvidia/nemotron-3-ultra", 38, 4.2, 3),',
              '            qualified("google/gemini-2.5-pro", 63, 11.25, 5),',
              '            qualified("anthropic/claude-opus-5", 1, 30.0, 5),',
              '            qualified("openai/gpt-5.6-sol", 2, 35.0, 2, "company-local-natural-top-layer"),',
              '        ]',
              '        with mock.patch.object(',
              '            selector, "_live_executable_flagship_rows", return_value=rows',
              '        ):',
              '            plan = selector.build_plan(ticket(), token="fixture")',
              '',
              '        ranked = plan["price_ranked_models"]',
              '        self.assertEqual([row["price_rank"] for row in ranked], list(range(1, 9)))',
              '        self.assertEqual(',
              '            [row["model"] for row in ranked],',
              '            [',
              '                "nex-agi/nex-n2-pro",',
              '                "deepseek/deepseek-v4-pro",',
              '                "xiaomi/mimo-v2.5-pro",',
              '                "minimax/minimax-m3",',
              '                "amazon/nova-pro-v1",',
              '                "nvidia/nemotron-3-ultra",',
              '                "google/gemini-2.5-pro",',
              '                "anthropic/claude-opus-5",',
              '            ],',
              '        )',
              '        companies = [row["company"] for row in ranked]',
              '        self.assertEqual(len(companies), len(set(companies)))',
              '        prices = [row["price_rank_usd_per_million"] for row in ranked]',
              '        self.assertEqual(prices, sorted(prices))',
              '        selected_companies = {row["company"] for row in plan["selected_models"]}',
              '        recovery_companies = {row["company"] for row in plan["recovery_models"]}',
              '        self.assertFalse(selected_companies & recovery_companies)',
              '        self.assertEqual(plan["company_uniqueness_scope"], "selected-and-recovery")',
              '        self.assertEqual(',
              '            plan["catalog_fetch_mode"], "live-per-task-no-cross-task-cache"',
              '        )',
              '        self.assertEqual(plan["minimum_qualified_provider_count"], 1)',
              '',
          ))
          text = sub_once(
              text,
              r'    def test_live_price_ranking_contains_one_model_per_company\(self\) -> None:\n.*?(?=\n\nif __name__)',
              price_test,
              "eight-model price test",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_expert_zdr_endpoint_parity.py")
          text = path.read_text(encoding="utf-8")
          benchmark_fields = "\n".join((
              '        "flagship_verified": True,',
              '        "flagship_basis": "strict-product-tier",',
              '        "company_flagship_method": "fixture-strict-tier",',
              '        "benchmark_source": "artificial-analysis-via-openrouter",',
              '        "intelligence_index": 50.0,',
              '        "coding_index": 50.0,',
              '        "agentic_index": 50.0,',
              '        "balanced_score": 50.0,',
              '        "benchmark_evidence_sha256": hashlib.sha256(',
              '            (model_id + "-benchmark").encode("utf-8")',
              '        ).hexdigest(),',
          ))
          text = sub_once(
              text,
              r'        "flagship_basis": "explicit-product-tier",',
              benchmark_fields,
              "ZDR benchmark fields",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run zero-call targeted tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_openrouter_governance_selector \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_zdr_endpoint_parity \
            tests.test_expert_child_plan_repair \
            tests.test_expert_plan_preview_workflow -v
      - name: Clean temporary files and refresh manifest
        run: |
          set -euo pipefail
          rm -f \
            tools/_apply_benchmarked_reasoning_flagship_patch.py \
            .github/workflows/apply-benchmarked-reasoning-flagships.yml \
            .github/workflows/execute-benchmarked-reasoning-flagships-v2.yml \
            .github/workflows/execute-benchmarked-reasoning-flagships-v3.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          version="$(jq -r '.governance_version' governance-release-manifest.json)"
          python tools/generate_governance_release_manifest.py \
            --root . \
            --output /tmp/governance-release-manifest.json \
            --version "$version"
          mv /tmp/governance-release-manifest.json governance-release-manifest.json
          test "$(find . -type d -name __pycache__ | wc -l)" -eq 0
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rank benchmarked company reasoning flagships"
          git push origin HEAD:fix/benchmarked-reasoning-company-flagships
