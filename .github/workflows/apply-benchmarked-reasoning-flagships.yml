name: Apply Benchmarked Reasoning Flagships

on:
  push:
    branches:
      - fix/benchmarked-reasoning-company-flagships

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/benchmarked-reasoning-company-flagships
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          set -euo pipefail
          python tools/_apply_benchmarked_reasoning_flagship_patch.py
      - name: Run zero-call targeted tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_openrouter_governance_selector \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_zdr_endpoint_parity \
            tests.test_expert_child_plan_repair \
            tests.test_expert_plan_preview_workflow -v
      - name: Clean temporary files and refresh manifest
        run: |
          set -euo pipefail
          rm tools/_apply_benchmarked_reasoning_flagship_patch.py
          rm .github/workflows/apply-benchmarked-reasoning-flagships.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          version="$(jq -r '.governance_version' governance-release-manifest.json)"
          python tools/generate_governance_release_manifest.py \
            --root . \
            --output /tmp/governance-release-manifest.json \
            --version "$version"
          mv /tmp/governance-release-manifest.json governance-release-manifest.json
          test "$(find . -type d -name __pycache__ | wc -l)" -eq 0
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rank benchmarked company reasoning flagships"
          git push origin HEAD:fix/benchmarked-reasoning-company-flagships
