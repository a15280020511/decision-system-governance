name: Apply Unique Company Signer Parity

on:
  push:
    branches:
      - fix/unique-company-signer-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/unique-company-signer-parity
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Patch signer, repairer, and tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) < count:
                  raise SystemExit(f"missing target in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          signer = "tools/sign_expert_plan.py"
          replace(signer, 'raise ExpertPlanSigningError("provider redundancy floor is not frozen")', 'raise ExpertPlanSigningError("ZDR provider floor is not frozen")')
          replace(signer, "    selected_companies: set[str] = set()\n    models: set[str] = set()\n", "    companies: set[str] = set()\n    models: set[str] = set()\n")
          replace(
              signer,
              '''            if field == "selected_models" and company in selected_companies:\n                raise ExpertPlanSigningError(\n                    "selected expert companies are not distinct"\n                )\n            if (\n                field == "selected_models"\n                and company in {"openai", "anthropic"}\n            ):\n                raise ExpertPlanSigningError(\n                    "governance companies cannot be selected expert companies"\n                )\n''',
              '''            if company in companies:\n                raise ExpertPlanSigningError(\n                    "expert model companies are not globally distinct"\n                )\n''',
          )
          replace(signer, '"model does not satisfy the qualified provider redundancy floor"', '"model does not satisfy the qualified ZDR provider floor"')
          replace(
              signer,
              '''            models.add(model)\n            if field == "selected_models":\n                selected_companies.add(company)\n''',
              '''            models.add(model)\n            companies.add(company)\n''',
          )

          repairer = "tools/repair_expert_child_plan.py"
          replace(repairer, "    selected_companies: set[str] = set()\n    models: set[str] = set()\n", "    companies: set[str] = set()\n    models: set[str] = set()\n")
          replace(
              repairer,
              '''            if field == "selected_models" and company in selected_companies:\n                raise ExpertChildRepairError(\n                    "regenerated primary plan reuses a model company"\n                )\n            if (\n                field == "selected_models"\n                and company in {"openai", "anthropic"}\n            ):\n                raise ExpertChildRepairError(\n                    "regenerated primary plan contains governance company"\n                )\n''',
              '''            if company in companies:\n                raise ExpertChildRepairError(\n                    "regenerated plan reuses a model company"\n                )\n''',
          )
          replace(repairer, '"model does not satisfy the qualified provider redundancy floor"', '"model does not satisfy the qualified ZDR provider floor"')
          replace(
              repairer,
              '''            models.add(model)\n            if field == "selected_models":\n                selected_companies.add(company)\n''',
              '''            models.add(model)\n            companies.add(company)\n''',
          )

          preview = "tests/test_expert_plan_preview_workflow.py"
          replace(preview, '"model does not satisfy the qualified provider redundancy floor",', '"model does not satisfy the qualified ZDR provider floor",')
          replace(
              preview,
              '''            "selected expert companies are not distinct",\n            "governance companies cannot be selected expert companies",\n''',
              '''            "expert model companies are not globally distinct",\n''',
          )

          child_test = "tests/test_expert_child_plan_repair.py"
          insertion = '''\n    def test_verify_repair_allows_openai_as_unique_company(self) -> None:\n        source = source_ticket()\n        repaired = dict(source)\n        new_plan = plan(repaired, provider_count=1)\n        new_plan["selected_models"][0]["model"] = "openai/gpt-5.6-luna-pro"\n        new_plan["selected_models"][0]["company"] = "openai"\n        new_plan["plan_sha256"] = repair._plan_digest(new_plan)\n        repaired["governance_model_plan"] = new_plan\n        repair.verify_repair(source, repaired, new_plan)\n\n    def test_verify_repair_rejects_company_reuse_across_recovery(self) -> None:\n        source = source_ticket()\n        repaired = dict(source)\n        new_plan = plan(repaired, provider_count=1)\n        new_plan["recovery_models"][0]["company"] = new_plan["selected_models"][0]["company"]\n        new_plan["plan_sha256"] = repair._plan_digest(new_plan)\n        repaired["governance_model_plan"] = new_plan\n        with self.assertRaisesRegex(\n            repair.ExpertChildRepairError,\n            "regenerated plan reuses a model company",\n        ):\n            repair.verify_repair(source, repaired, new_plan)\n'''
          marker = "    def test_verify_repair_rejects_preproduction_context_floor(self) -> None:\n"
          replace(child_test, marker, insertion + "\n" + marker)

          Path(".github/workflows/apply-unique-company-signer-parity.yml").unlink()
          PY
      - name: Commit parity fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce global company uniqueness in signer'
          for attempt in 1 2 3; do
            if git push origin HEAD:fix/unique-company-signer-parity; then
              exit 0
            fi
            git fetch origin fix/unique-company-signer-parity
            git rebase origin/fix/unique-company-signer-parity
          done
          exit 1
