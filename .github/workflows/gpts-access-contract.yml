name: GPTs Access Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gpts-access-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce live GPT and governance permission boundary
        run: python security/access_contract.py

      - name: Run adversarial permission mutation matrix
        run: python -m unittest tests.test_access_contract -v
