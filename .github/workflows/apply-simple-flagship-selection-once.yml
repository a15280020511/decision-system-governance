name: Apply Simple Flagship Selection Once

on:
  push:
    branches:
      - fix/simple-flagship-price-selection

permissions:
  contents: write

jobs:
  verify-and-freeze:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/simple-flagship-price-selection
          fetch-depth: 0
          persist-credentials: true

      - name: Verify simple price selection and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_expert_plan_strict_flagship_policy -v
          python -m compileall -q governance-copilot tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check

          rm .github/workflows/apply-simple-flagship-selection-once.yml
          python tools/generate_governance_release_manifest.py \
            --root . \
            --output governance-release-manifest.json \
            --version 4.2.4

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance-copilot/select_expert_team_plan.py \
            tests/test_expert_plan_strict_flagship_policy.py \
            governance-release-manifest.json \
            .github/workflows/apply-simple-flagship-selection-once.yml
          git commit -m "chore: freeze simple flagship price selector"
          git push origin HEAD:fix/simple-flagship-price-selection
