name: Run Reasoning Flagship Price Order

on:
  push:
    branches:
      - "fix/reasoning-flagship-price-order"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "fix/reasoning-flagship-price-order"
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Apply selector patch
        run: python tools/apply_reasoning_flagship_price_order.py
      - name: Run zero-call regression tests
        run: |
          set -euo pipefail
          python -m compileall -q governance-copilot tests
          python -m unittest \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_intelligence_ranked_roles \
            tests.test_governance_recovery_budget \
            tests.test_expert_task_envelope_parity -v
      - name: Commit source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            governance-copilot/select_expert_team_plan.py \
            governance-copilot/expert_task_envelope.py \
            tests/test_expert_plan_strict_flagship_policy.py; then
            echo "Selector already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            governance-copilot/select_expert_team_plan.py \
            governance-copilot/expert_task_envelope.py \
            tests/test_expert_plan_strict_flagship_policy.py
          git commit -m "fix: rank company reasoning flagships by price"
          git push origin HEAD:fix/reasoning-flagship-price-order
