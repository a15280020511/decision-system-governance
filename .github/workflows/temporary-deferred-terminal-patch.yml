name: Temporary Deferred Terminal Patch

on:
  push:
    branches: [fix/deferred-terminal-validation-20260805]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/deferred-terminal-validation-20260805
          fetch-depth: 0

      - name: Apply exact fail-closed deferred validation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("control-plane/control_plane.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          old_runtime = '''        actual_task_id = _extract_task_id(raw_body)
          if expected_task_id and actual_task_id != expected_task_id:
              detail = (
                  f"Expected Task ID `{expected_task_id}` but terminal contained "
                  f"`{actual_task_id or 'missing'}`.\\n\\n{raw_body}"
              )
              return "CONTROL_CHILD_TASK_MISMATCH", detail, False
          if success:
              contract_error = _artifact_contract_error(route, raw_body)
              if contract_error:
                  return (
                      "CONTROL_CHILD_EVIDENCE_INVALID",
                      f"{contract_error}.\\n\\n{raw_body}",
                      False,
                  )
          return matched_status, raw_body, success
  '''
          new_runtime = '''        actual_task_id = _extract_task_id(raw_body)
          if expected_task_id and actual_task_id != expected_task_id:
              # CONTROL_CHILD_TASK_MISMATCH remains provisional while a later
              # task-bound terminal may still be published by a bounded fallback.
              continue
          if success:
              contract_error = _artifact_contract_error(route, raw_body)
              if contract_error:
                  # CONTROL_CHILD_EVIDENCE_INVALID remains provisional while a
                  # corrected audited Artifact receipt may still arrive.
                  continue
          return matched_status, raw_body, success
  '''
          if old_runtime in runtime:
              runtime = runtime.replace(old_runtime, new_runtime, 1)
              runtime_path.write_text(runtime, encoding="utf-8")
          elif new_runtime not in runtime:
              raise SystemExit("runtime patch anchor not found")

          test_path = Path("tests/test_control_plane.py")
          tests = test_path.read_text(encoding="utf-8")
          old_tests = '''    def test_task_id_mismatch_is_terminal_security_failure(self) -> None:
          heading, excerpt, success = MODULE._trusted_terminal(
              [self.bot(self.compute_success("wrong-task"))],
              route="compute",
              expected_task_id="gov-1-compute",
          )
          self.assertEqual(heading, "CONTROL_CHILD_TASK_MISMATCH")
          self.assertIn("wrong-task", excerpt)
          self.assertFalse(success)

      def test_success_without_artifact_contract_is_failure(self) -> None:
          body = "## API_COMPLETED\\n\\n- Task ID: `gov-3-intelligence`"
          heading, excerpt, success = MODULE._trusted_terminal(
              [self.bot(body)],
              route="intelligence",
              expected_task_id="gov-3-intelligence",
          )
          self.assertEqual(heading, "CONTROL_CHILD_EVIDENCE_INVALID")
          self.assertIn("Artifact ID", excerpt)
          self.assertFalse(success)
  '''
          new_tests = '''    def test_task_id_mismatch_is_ignored_until_matching_terminal(self) -> None:
          wrong = self.bot(self.compute_success("wrong-task"))
          self.assertIsNone(
              MODULE._trusted_terminal(
                  [wrong],
                  route="compute",
                  expected_task_id="gov-1-compute",
              )
          )
          heading, _, success = MODULE._trusted_terminal(
              [wrong, self.bot(self.compute_success("gov-1-compute"))],
              route="compute",
              expected_task_id="gov-1-compute",
          )
          self.assertEqual(heading, "COMPUTE_COMPLETED")
          self.assertTrue(success)

      def test_success_without_artifact_contract_is_ignored_until_corrected(self) -> None:
          body = "## API_COMPLETED\\n\\n- Task ID: `gov-3-intelligence`"
          self.assertIsNone(
              MODULE._trusted_terminal(
                  [self.bot(body)],
                  route="intelligence",
                  expected_task_id="gov-3-intelligence",
              )
          )
  '''
          if old_tests in tests:
              tests = tests.replace(old_tests, new_tests, 1)
              test_path.write_text(tests, encoding="utf-8")
          elif new_tests not in tests:
              raise SystemExit("test patch anchor not found")
          PY

      - name: Commit deterministic hotfix
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-plane/control_plane.py tests/test_control_plane.py
          git commit -m "fix: defer malformed terminal decisions until matching receipt"
          git push origin HEAD:fix/deferred-terminal-validation-20260805
