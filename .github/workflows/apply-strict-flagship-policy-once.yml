name: Apply Strict Flagship Policy Once

on:
  push:
    branches:
      - fix/strict-flagship-price-order

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/strict-flagship-price-order
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify strict flagship policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_strict_flagship_patch.py
          python -m unittest tests.test_expert_plan_strict_flagship_policy -v
          python -m compileall -q governance-copilot tests
          git diff --check

          workflow='.github/workflows/apply-strict-flagship-policy-once.yml'
          helper='tools/apply_strict_flagship_patch.py'
          mv "$workflow" /tmp/apply-strict-flagship-policy-once.yml
          mv "$helper" /tmp/apply_strict_flagship_patch.py
          python tools/generate_governance_release_manifest.py \
            --root . \
            --output governance-release-manifest.json \
            --version 4.2.3
          mv /tmp/apply-strict-flagship-policy-once.yml "$workflow"
          mv /tmp/apply_strict_flagship_patch.py "$helper"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance-copilot/select_expert_team_plan.py \
            tests/test_expert_plan_strict_flagship_policy.py \
            governance-release-manifest.json
          git commit -m "fix: enforce strict flagship price ordering"
          git push origin HEAD:fix/strict-flagship-price-order
