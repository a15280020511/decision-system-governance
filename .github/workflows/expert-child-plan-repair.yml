name: Governance Expert Child Plan Repair

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing expert child Issue number
        required: true
        type: string
      expected_task_id:
        description: Exact existing governance task ID
        required: true
        type: string
      retry_id:
        description: New unique expert retry ID
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: governance-expert-child-plan-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.title == '[control]' &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/repair-expert-child-plan '))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHILD_REPOSITORY: a15280020511/expert-assessment-center
      GH_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout governance main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Resolve and validate repair inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_TASK_ID: ${{ inputs.expected_task_id }}
          DISPATCH_RETRY_ID: ${{ inputs.retry_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import shlex
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              issue = os.environ.get("DISPATCH_ISSUE_NUMBER", "")
              task = os.environ.get("DISPATCH_TASK_ID", "")
              retry = os.environ.get("DISPATCH_RETRY_ID", "")
          else:
              parts = shlex.split(os.environ.get("COMMENT_BODY", ""))
              if len(parts) != 4 or parts[0] != "/repair-expert-child-plan":
                  raise SystemExit("invalid repair comment command")
              _, issue, task, retry = parts

          if not re.fullmatch(r"[1-9][0-9]*", issue):
              raise SystemExit("invalid child issue number")
          if not re.fullmatch(r"gov-[1-9][0-9]*-expert", task):
              raise SystemExit("invalid expected task id")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", retry):
              raise SystemExit("invalid retry id")
          if not os.environ.get("GH_TOKEN"):
              raise SystemExit("CONTROL_PLANE_TOKEN is missing")
          if not os.environ.get("OPENROUTER_API_KEY"):
              raise SystemExit("OPENROUTER_API_KEY is missing")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"issue_number={issue}\n")
              stream.write(f"expected_task_id={task}\n")
              stream.write(f"retry_id={retry}\n")
          PY

      - name: Fetch exact existing child ticket
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          EXPECTED_TASK_ID: ${{ steps.inputs.outputs.expected_task_id }}
        run: |
          set -euo pipefail
          title="$(gh api "repos/${CHILD_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.title')"
          expected_title="[execution] ${EXPECTED_TASK_ID} via governance"
          test "$title" = "$expected_title"
          gh api "repos/${CHILD_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '.body // ""' > source-ticket.json

      - name: Regenerate executable immutable plan
        env:
          EXPECTED_TASK_ID: ${{ steps.inputs.outputs.expected_task_id }}
          RETRY_ID: ${{ steps.inputs.outputs.retry_id }}
        run: |
          set -euo pipefail
          python tools/repair_expert_child_plan.py \
            --source-body source-ticket.json \
            --expected-task-id "$EXPECTED_TASK_ID" \
            --retry-id "$RETRY_ID" \
            --output-ticket repaired-ticket.json \
            --output-plan regenerated-plan.json \
            | tee repair-receipt.json

      - name: Update the same child Issue and trigger one controlled retry
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          RETRY_ID: ${{ steps.inputs.outputs.retry_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${CHILD_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -F body=@repaired-ticket.json \
            -f state=open
          gh api --method POST \
            "repos/${CHILD_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="/retry-expert-team ${RETRY_ID}"

      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: expert-child-plan-repair-${{ steps.inputs.outputs.issue_number }}-${{ steps.inputs.outputs.retry_id }}
          path: |
            repaired-ticket.json
            regenerated-plan.json
            repair-receipt.json
          if-no-files-found: error
          retention-days: 14
