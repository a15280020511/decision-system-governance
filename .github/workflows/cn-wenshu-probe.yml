name: CN Wenshu Probe

on:
  push:
    branches:
      - probe/cn-wenshu-20260808
    paths:
      - .github/workflows/cn-wenshu-probe.yml

permissions:
  contents: read

jobs:
  browser-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CN_PROXY: http://115.231.181.40:8128
    steps:
      - name: Verify working CN proxy
        shell: bash
        run: |
          set -x
          curl -L -sS --connect-timeout 5 --max-time 15 -x "$CN_PROXY" -o /tmp/list.html -w 'HTTP=%{http_code} CONNECT=%{time_connect} TLS=%{time_appconnect} TOTAL=%{time_total} REMOTE=%{remote_ip}\n' 'https://wenshu.court.gov.cn/website/wenshu/181217BMTKHNT2W0/index.html'
          echo "BYTES=$(wc -c < /tmp/list.html)"

      - name: Browser environment
        shell: bash
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version || true
          chromedriver --version || true
          python --version
          python -m pip install -q selenium

      - name: Search 劳动争议 in browser
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import os, time, json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          proxy = os.environ['CN_PROXY']
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,1200')
          opts.add_argument(f'--proxy-server={proxy}')
          opts.add_argument('--ignore-certificate-errors')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0 Safari/537.36')

          d = webdriver.Chrome(options=opts)
          d.set_page_load_timeout(45)
          url = 'https://wenshu.court.gov.cn/website/wenshu/181217BMTKHNT2W0/index.html'
          try:
              d.get(url)
              time.sleep(8)
              print('INITIAL_URL=', d.current_url)
              print('TITLE=', d.title)
              body = d.find_element(By.TAG_NAME, 'body').text
              print('INITIAL_BODY=', body[:4000].replace('\n',' | '))

              print('INPUTS_BEGIN')
              inputs = d.find_elements(By.CSS_SELECTOR, 'input')
              for i,e in enumerate(inputs):
                  try:
                      print(i, json.dumps({
                          'type': e.get_attribute('type'),
                          'id': e.get_attribute('id'),
                          'name': e.get_attribute('name'),
                          'placeholder': e.get_attribute('placeholder'),
                          'class': e.get_attribute('class'),
                          'displayed': e.is_displayed(),
                          'enabled': e.is_enabled(),
                      }, ensure_ascii=False))
                  except Exception as ex:
                      print(i, 'ERR', repr(ex))
              print('INPUTS_END')

              # Open advanced search if available.
              adv = d.find_elements(By.XPATH, "//*[contains(normalize-space(.), '高级检索')]")
              for e in adv:
                  try:
                      if e.is_displayed() and e.is_enabled():
                          print('CLICK_ADV=', e.tag_name, e.text[:100])
                          d.execute_script('arguments[0].click();', e)
                          time.sleep(2)
                          break
                  except Exception:
                      pass

              # Re-enumerate visible text inputs after advanced search opens.
              candidates=[]
              for i,e in enumerate(d.find_elements(By.CSS_SELECTOR, 'input')):
                  try:
                      typ=(e.get_attribute('type') or 'text').lower()
                      ph=e.get_attribute('placeholder') or ''
                      if e.is_displayed() and e.is_enabled() and typ in ('text','search',''):
                          candidates.append((i,e,ph))
                  except Exception:
                      pass
              print('VISIBLE_TEXT_INPUTS=', [(i,ph) for i,_,ph in candidates])

              target=None
              preferred=('案由','关键词','全文','案件名称','请输入')
              for key in preferred:
                  for i,e,ph in candidates:
                      if key in ph:
                          target=e; print('TARGET_BY_PLACEHOLDER=', key, ph); break
                  if target: break
              if target is None and candidates:
                  target=candidates[0][1]
                  print('TARGET_FALLBACK_INDEX=', candidates[0][0])

              if target is not None:
                  target.clear()
                  target.send_keys('劳动争议')
                  print('FILLED_VALUE=', target.get_attribute('value'))
                  # First try explicit search/retrieve button.
                  clicked=False
                  for label in ('搜索','检索','查询'):
                      els=d.find_elements(By.XPATH, f"//*[self::button or self::a or @role='button'][contains(normalize-space(.), '{label}')]")
                      for e in els:
                          try:
                              if e.is_displayed() and e.is_enabled():
                                  print('CLICK_SEARCH=', label, e.tag_name, e.text[:100])
                                  d.execute_script('arguments[0].click();', e)
                                  clicked=True
                                  break
                          except Exception:
                              pass
                      if clicked: break
                  if not clicked:
                      target.send_keys(Keys.ENTER)
                      print('SEARCH_BY_ENTER=1')
                  time.sleep(10)
                  print('AFTER_URL=', d.current_url)
                  print('AFTER_TITLE=', d.title)
                  after=d.find_element(By.TAG_NAME,'body').text
                  print('AFTER_BODY=', after[:7000].replace('\n',' | '))
                  for marker in ('劳动争议','裁判日期','法院','案号','登录','验证码','暂无数据','无数据','文书'):
                      print('MARKER', marker, after.count(marker))
              else:
                  print('NO_SEARCH_INPUT_FOUND')
          finally:
              d.quit()
          PY
          python /tmp/probe.py
