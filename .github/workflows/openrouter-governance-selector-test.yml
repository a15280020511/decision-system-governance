name: Validate OpenRouter Governance Flagship Selector

on:
  push:
    branches:
      - main
      - production
      - test/openrouter-high-level-price-selection
    paths:
      - "governance-copilot/**"
      - ".github/workflows/openrouter-governance-selector-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "governance-copilot/**"
      - ".github/workflows/openrouter-governance-selector-test.yml"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-governance-selector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Compile selector sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile governance-copilot/*.py governance-copilot/tests/*.py

      - name: Run complex deterministic resilience suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s governance-copilot/tests \
            -p 'test_*.py' \
            -v

  live-stability:
    needs: offline-resilience
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is not configured" >&2
            exit 1
          fi

      - name: Run three independent live selections
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            python governance-copilot/select_paid_governance_flagship_model.py \
              --output-dir "openrouter-selection/run-${run}"
            sleep 2
          done

      - name: Verify repeated live stability and receipt safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("openrouter-selection")
          receipts = [
              json.loads((root / f"run-{index}" / "selection.json").read_text(encoding="utf-8"))
              for index in (1, 2, 3)
          ]
          selected = [receipt["selected_model"]["model_id"] for receipt in receipts]
          candidate_orders = [
              [row["model_id"] for row in receipt["cheapest_paid_flagship_candidates"]]
              for receipt in receipts
          ]
          if len(set(selected)) != 1:
              raise SystemExit(f"live selected model changed across immediate runs: {selected}")
          if not all(order == candidate_orders[0] for order in candidate_orders[1:]):
              raise SystemExit("live candidate order changed across immediate runs")

          token = os.environ.get("OPENROUTER_API_KEY", "")
          for path in root.rglob("*"):
              if path.is_file():
                  text = path.read_text(encoding="utf-8")
                  if token and token in text:
                      raise SystemExit(f"secret value leaked into {path}")
          for receipt in receipts:
              if receipt.get("model_calls") != 0:
                  raise SystemExit("selector receipt claims a model call")
              if receipt.get("estimated_model_cost_usd") != 0:
                  raise SystemExit("selector receipt claims model cost")
              if receipt.get("secret_values_exposed") is not False:
                  raise SystemExit("selector receipt does not explicitly deny secret exposure")

          summary = {
              "status": "REPEATED_LIVE_SELECTION_STABLE",
              "selected_model": selected[0],
              "repeat_count": 3,
              "candidate_count": len(candidate_orders[0]),
              "model_calls": 0,
              "estimated_model_cost_usd": 0,
              "secret_values_exposed": False,
          }
          (root / "stability-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          cat openrouter-selection/run-1/selection.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Repeated live stability\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Three independent catalog reads: PASS\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Selected model and candidate order identical: PASS\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Secret leakage scan: PASS\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Model calls and model cost: 0\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload selection and stability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openrouter-governance-flagship-stability-${{ github.run_id }}
          path: openrouter-selection/
          if-no-files-found: error
          retention-days: 14
