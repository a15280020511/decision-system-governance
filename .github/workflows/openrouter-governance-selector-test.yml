name: Test OpenRouter Paid Flagship Model Selection

on:
  push:
    branches:
      - test/openrouter-high-level-price-selection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-paid-governance-selector-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is not configured" >&2
            exit 1
          fi

      - name: Select cheapest paid flagship model
        shell: bash
        run: |
          set -euo pipefail
          python governance-copilot/select_paid_flagship_model.py \
            --output-dir openrouter-selection
          cat openrouter-selection/selection.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload selection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openrouter-paid-flagship-selection-${{ github.run_id }}
          path: openrouter-selection/
          if-no-files-found: error
          retention-days: 7
