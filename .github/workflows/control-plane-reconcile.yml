name: Governance Async Terminal Reconciliation

on:
  workflow_run:
    workflows:
      - Governance Control Plane
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: governance-control-global-worker
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout governance control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Reconcile oldest open asynchronous task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
          GOVERNANCE_HTTP_AUDIT_FILE: async-reconcile-http-audit.jsonl
          GOVERNANCE_HTTP_MAX_ATTEMPTS: "4"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # A workflow_run reconciliation is the durable watcher for the ticket
          # it just dispatched.  The previous 10-minute observation window could
          # finish immediately before a valid expert terminal arrived, leaving
          # correctness to best-effort cron scheduling.  Keep polling until the
          # control-plane ticket itself reaches a terminal or the maximum
          # governance wait envelope is exhausted.  This is asynchronous control
          # plane waiting, not a model/business execution gate.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deadline=$(( $(date +%s) + 2640 ))
            attempt=0
            while :; do
              attempt=$(( attempt + 1 ))
              echo "Asynchronous reconciliation attempt ${attempt}"
              output=$(python control-plane/async_reconcile.py \
                --repository "$GITHUB_REPOSITORY")
              echo "$output"
              status=$(printf '%s\n' "$output" | tail -n 1 | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              if [ "$status" != "ASYNC_WAITING" ]; then
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Watcher envelope exhausted; deferred reconciliation remains available."
                break
              fi
              sleep 30
            done
          else
            python control-plane/async_reconcile.py \
              --repository "$GITHUB_REPOSITORY"
          fi

      - name: Reconcile closed late terminal results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
          GOVERNANCE_HTTP_AUDIT_FILE: late-reconcile-http-audit.jsonl
          GOVERNANCE_HTTP_MAX_ATTEMPTS: "4"
        run: |
          python control-plane/deferred_reconcile.py \
            --repository "$GITHUB_REPOSITORY"
