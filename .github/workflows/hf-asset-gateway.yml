name: Validate and Run Governance Hugging Face Asset Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - "hf-asset-gateway/**"
      - ".github/workflows/hf-asset-gateway.yml"
      - "SECURITY_BOUNDARIES.md"
  push:
    branches: [main]
    paths:
      - "hf-asset-gateway/**"
      - ".github/workflows/hf-asset-gateway.yml"
      - "SECURITY_BOUNDARIES.md"
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      operation:
        description: Asset gateway operation
        required: true
        type: choice
        options:
          - health
          - bootstrap
        default: health

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-hf-assets-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner && github.event.issue.title == '[hf-assets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-asset-gateway/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r hf-asset-gateway/requirements.txt
          python -m pip check

      - name: Compile, test and validate contract
        env:
          HF_TOKEN: ""
          HF_EVALUATION_RESULTS_DATASET_REPO: ""
          HF_MANAGED_MODEL_REPO: ""
          HF_READONLY_SPACE_REPO: ""
        run: |
          set -euo pipefail
          python -m py_compile hf-asset-gateway/gateway.py
          python -m unittest hf-asset-gateway/tests/test_gateway.py -v
          python hf-asset-gateway/gateway.py validate \
            --output-dir hf-assets-validation
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('hf-assets-validation/receipt.json').read_text(encoding='utf-8'))
          assert row['status'] == 'HF_ASSET_GATEWAY_CONTRACT_VALIDATED'
          assert row['secret_values_exposed'] is False
          assert row['model_calls'] == 0
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-hf-assets-validation-${{ github.run_id }}
          path: hf-assets-validation/
          if-no-files-found: error
          retention-days: 30

  execute:
    if: >-
      always() &&
      (github.event_name == 'issues' || github.event_name == 'workflow_dispatch') &&
      needs.validate.result == 'success'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_EVALUATION_RESULTS_DATASET_REPO: ${{ vars.HF_EVALUATION_RESULTS_DATASET_REPO }}
      HF_MANAGED_MODEL_REPO: ${{ vars.HF_MANAGED_MODEL_REPO }}
      HF_READONLY_SPACE_REPO: ${{ vars.HF_READONLY_SPACE_REPO }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-asset-gateway/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r hf-asset-gateway/requirements.txt
          python -m pip check

      - name: Resolve and authorize operation
        id: prepare
        env:
          DISPATCH_OPERATION: ${{ inputs.operation || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          event_name = os.environ['GITHUB_EVENT_NAME']
          if event_name == 'issues':
              issue = event.get('issue') or {}
              sender = event.get('sender') or {}
              if issue.get('title') != '[hf-assets]':
                  raise SystemExit('issue title must be exactly [hf-assets]')
              if sender.get('login') != os.environ['GITHUB_REPOSITORY_OWNER']:
                  raise SystemExit('ticket actor must be repository owner')
              body = json.loads(issue.get('body') or '')
              if set(body) != {'schema_version', 'operation'}:
                  raise SystemExit('ticket fields must be exactly schema_version and operation')
              if body.get('schema_version') != 'governance-hf-assets-ticket-v1':
                  raise SystemExit('unsupported ticket schema')
              operation = body.get('operation')
          else:
              operation = os.environ.get('DISPATCH_OPERATION')
          if operation not in {'bootstrap', 'health'}:
              raise SystemExit('operation must be bootstrap or health')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'operation={operation}\n')
          PY

      - name: Run governed asset operation
        id: execute
        continue-on-error: true
        run: |
          python hf-asset-gateway/gateway.py "${{ steps.prepare.outputs.operation }}" \
            --output-dir hf-assets-run

      - name: Render safe receipt
        if: always()
        run: |
          python hf-asset-gateway/gateway.py render \
            --output-dir hf-assets-run > hf-assets-comment.md || true
          cat hf-assets-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish issue receipt
        if: always() && github.event_name == 'issues'
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@hf-assets-comment.md

      - name: Upload safe asset evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-hf-assets-${{ github.run_id }}
          path: |
            hf-assets-run/*.json
            hf-assets-comment.md
          if-no-files-found: warn
          retention-days: 90

      - name: Mark failed operation
        if: always() && steps.execute.outcome != 'success'
        run: exit 1
