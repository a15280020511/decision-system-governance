name: Apply top50 reasoning pool upgrade

on:
  push:
    branches:
      - feat/top50-reasoning-pool
    paths:
      - tools/apply_top50_pool_upgrade.py
      - .github/workflows/apply-top50-pool-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/top50-reasoning-pool
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply upgrade
        run: python tools/apply_top50_pool_upgrade.py
      - name: Validate Python
        run: |
          python -m py_compile governance-copilot/top50_reasoning_pool_extension.py tools/sign_expert_plan.py
          python -m unittest tests.test_top20_reasoning_pool tests.test_top50_reasoning_pool_extension
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: attach weekly top50 reasoning pool" || exit 0
          git push origin HEAD:feat/top50-reasoning-pool
