name: Fix Reasoning Patch Fixtures

on:
  push:
    branches:
      - fix/reasoning-company-flagship-ranking

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/reasoning-company-flagship-ranking
          persist-credentials: true
          fetch-depth: 0
      - name: Correct embedded deterministic fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-reasoning-company-flagship-ranking.yml')
          text = path.read_text(encoding='utf-8')
          old = 'qualified(\"openai/gpt-5.6-sol-pro\", 5, 2.5, 2)'
          new = 'qualified(\"openai/gpt-5.6-sol-pro\", 5, 0.7, 2)'
          if old not in text:
              raise SystemExit('Sol fixture price marker missing')
          text = text.replace(old, new, 1)
          old_test = '''        filtered = planner._catalog_candidates(\n            {\"data\": [model(\"vendor/cheap-pro\", 0.1, 0.2, reasoning=False)]}\n        )\n        self.assertEqual(filtered, [])'''
          new_test = '''        with self.assertRaisesRegex(\n            planner.ExpertPlanError,\n            \"no paid general-purpose reasoning company flagship\",\n        ):\n            planner._catalog_candidates(\n                {\"data\": [model(\"vendor/cheap-pro\", 0.1, 0.2, reasoning=False)]}\n            )'''
          if old_test not in text:
              raise SystemExit('empty candidate test marker missing')
          text = text.replace(old_test, new_test, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-reasoning-patch-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "chore: correct reasoning patch fixtures"
          git push origin HEAD:fix/reasoning-company-flagship-ranking
