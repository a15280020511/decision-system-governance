name: Legal Platform US Probe

on:
  push:
    branches:
      - probe/cn-wenshu-20260808
    paths:
      - .github/workflows/legal-platform-us-probe.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: HTTP targeted paths
        shell: bash
        run: |
          set +e
          for u in \
            'http://www.faxin.cn/' \
            'https://alphalawyer.cn/main/' \
            'https://www.jufaanli.com/Home/BaseSearch/tool' \
            'https://www.pkulaw.com/'
          do
            echo "=== $u ==="
            curl -L -sS -I --connect-timeout 6 --max-time 18 -w 'FINAL=%{url_effective} HTTP=%{http_code} REMOTE=%{remote_ip} TOTAL=%{time_total}\n' "$u" | sed -n '1,14p'
          done

      - name: Targeted anonymous browser search
        shell: bash
        run: |
          python -m pip install -q selenium
          cat > /tmp/targeted.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1200','--lang=zh-CN']:
              opts.add_argument(a)
          opts.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36')
          d=webdriver.Chrome(options=opts)
          d.set_page_load_timeout(30)

          def txt():
              try:return d.find_element(By.TAG_NAME,'body').text
              except:return ''

          tests=[('Alpha','https://alphalawyer.cn/main/'),('聚法','https://www.jufaanli.com/Home/BaseSearch/tool')]
          for name,url in tests:
              print('\n===',name,'===')
              try:
                  d.get(url); time.sleep(8)
                  body=txt(); print('URL=',d.current_url); print('TITLE=',d.title); print('BODY=',body[:2500].replace('\n',' | '))
                  if name=='聚法':
                      els=d.find_elements(By.XPATH,"//*[normalize-space(text())='劳动争议']")
                      print('LABOR_LINKS=',len(els))
                      clicked=False
                      for e in els:
                          try:
                              if e.is_displayed():
                                  d.execute_script('arguments[0].click();',e); clicked=True; break
                          except: pass
                      if clicked:
                          time.sleep(10); a=txt(); print('AFTER_URL=',d.current_url); print('AFTER_BODY=',a[:3000].replace('\n',' | ')); print('MARKERS=',{m:a.count(m) for m in ['劳动争议','案号','法院','登录','注册','案例']})
                      else: print('NO_CLICKABLE_LABOR_LINK')
                  else:
                      vis=[]
                      for e in d.find_elements(By.CSS_SELECTOR,'input'):
                          try:
                              if e.is_displayed() and e.is_enabled() and (e.get_attribute('type') or 'text').lower() in ('text','search',''):
                                  vis.append(e)
                          except: pass
                      print('VISIBLE_INPUTS=',[(e.get_attribute('placeholder') or '') for e in vis])
                      target=None
                      for e in vis:
                          ph=e.get_attribute('placeholder') or ''
                          if any(k in ph for k in ['搜索','检索','关键词','请输入']): target=e; break
                      if target:
                          target.clear(); target.send_keys('劳动争议'); target.send_keys(Keys.ENTER); time.sleep(10)
                          a=txt(); print('AFTER_URL=',d.current_url); print('AFTER_BODY=',a[:3000].replace('\n',' | ')); print('MARKERS=',{m:a.count(m) for m in ['劳动争议','案号','法院','登录','案例','法规']})
                      else: print('NO_SEARCH_INPUT')
              except Exception as ex:
                  print('ERR=',type(ex).__name__,str(ex)[:400])
          d.quit()
          PY
          python /tmp/targeted.py
