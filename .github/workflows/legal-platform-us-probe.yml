name: Legal Platform US Probe

on:
  push:
    branches:
      - probe/cn-wenshu-20260808
    paths:
      - .github/workflows/legal-platform-us-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: HTTP reachability
        shell: bash
        run: |
          set +e
          urls=(
            'https://sfb.pkulaw.com/'
            'https://law.wkinfo.com.cn/'
            'https://www.faxin.cn/'
            'https://alphalawyer.cn/'
            'https://www.jufaanli.com/'
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -L -sS -I --connect-timeout 6 --max-time 20 -w 'FINAL=%{url_effective} HTTP=%{http_code} REMOTE=%{remote_ip} TOTAL=%{time_total}\n' "$u" | sed -n '1,12p'
          done

      - name: Browser probe and anonymous search
        shell: bash
        run: |
          python -m pip install -q selenium
          cat > /tmp/probe.py <<'PY'
          import time, json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          sites = [
              ('北大法宝', 'https://sfb.pkulaw.com/'),
              ('威科先行', 'https://law.wkinfo.com.cn/'),
              ('法信', 'https://www.faxin.cn/'),
              ('Alpha', 'https://alphalawyer.cn/'),
              ('聚法案例', 'https://www.jufaanli.com/'),
          ]
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0 Safari/537.36')
          d = webdriver.Chrome(options=opts)
          d.set_page_load_timeout(35)

          def body_text():
              try: return d.find_element(By.TAG_NAME, 'body').text
              except Exception: return ''

          for name, url in sites:
              print('\n===== SITE', name, '=====')
              try:
                  d.get(url)
                  time.sleep(7)
                  body = body_text()
                  print('URL=', d.current_url)
                  print('TITLE=', d.title)
                  print('BODY=', body[:2200].replace('\n',' | '))
                  print('MARKERS=', {m: body.count(m) for m in ['登录','注册','检索','搜索','案例','法规','免费','试用','验证码']})
                  candidates=[]
                  for i,e in enumerate(d.find_elements(By.CSS_SELECTOR,'input')):
                      try:
                          typ=(e.get_attribute('type') or 'text').lower()
                          ph=e.get_attribute('placeholder') or ''
                          val=e.get_attribute('value') or ''
                          if e.is_displayed() and e.is_enabled() and typ in ('text','search',''):
                              candidates.append((i,e,ph,val))
                      except Exception:
                          pass
                  print('VISIBLE_INPUTS=', [(i,ph,val[:40]) for i,_,ph,val in candidates])

                  target=None
                  for key in ['搜索','检索','关键词','关键字','案由','法规','案例','请输入']:
                      for i,e,ph,val in candidates:
                          if key in ph:
                              target=e; print('TARGET=', key, ph); break
                      if target is not None: break
                  if target is None and len(candidates)==1:
                      target=candidates[0][1]; print('TARGET=ONLY_VISIBLE_INPUT')

                  if target is not None:
                      try:
                          target.clear(); target.send_keys('劳动争议'); target.send_keys(Keys.ENTER)
                          time.sleep(10)
                          after=body_text()
                          print('AFTER_URL=', d.current_url)
                          print('AFTER_TITLE=', d.title)
                          print('AFTER_BODY=', after[:3000].replace('\n',' | '))
                          print('AFTER_MARKERS=', {m: after.count(m) for m in ['劳动争议','案号','法院','裁判日期','登录','注册','验证码','案例','法规','无数据','暂无']})
                      except Exception as ex:
                          print('SEARCH_ERR=', type(ex).__name__, str(ex)[:300])
                  else:
                      print('SEARCH_RESULT=NO_ANONYMOUS_VISIBLE_SEARCH_INPUT')
              except Exception as ex:
                  print('LOAD_ERR=', type(ex).__name__, str(ex)[:500])
          d.quit()
          PY
          python /tmp/probe.py
