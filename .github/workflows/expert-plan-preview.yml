name: Governance Expert Plan Preview

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-expert-plan-preview
  cancel-in-progress: false

jobs:
  sign-expert-plan:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[expert-plan]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout governance signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Sign immutable expert plan with production contract
        id: sign
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python tools/sign_expert_plan.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir expert-plan-artifacts

      - name: Upload immutable signed plan
        id: artifact
        if: ${{ always() && steps.sign.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-expert-plan-preview-${{ github.run_id }}
          path: expert-plan-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed ticket to the same Issue
        id: publish
        if: ${{ always() && steps.sign.outcome == 'success' && steps.artifact.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          SIGNED_TICKET_FILE: expert-plan-artifacts/signed-ticket-body.md
          RECEIPT_FILE: expert-plan-artifacts/plan-preview-receipt.json
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            const signed = fs.readFileSync(process.env.SIGNED_TICKET_FILE, 'utf8');
            const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_FILE, 'utf8'));
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: signed,
              state: 'closed',
              state_reason: 'completed'
            });
            const models = (receipt.selected_models || []).map(value => `\`${value}\``).join(', ');
            const recoveries = (receipt.recovery_models || []).map(value => `\`${value}\``).join(', ') || 'none';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## EXPERT_PLAN_COMPLETED',
                '',
                `- Task ID: \`${receipt.task_id}\``,
                `- Plan SHA256: \`${receipt.plan_sha256}\``,
                `- Selected models: ${models}`,
                `- Recovery models: ${recoveries}`,
                `- Required context tokens: \`${receipt.required_context_tokens}\``,
                `- Minimum qualified providers per model: \`${receipt.minimum_qualified_provider_count}\``,
                '- Selection authority: `decision-system-governance`',
                '- Model calls: `0`',
                '- Child dispatch: `false`',
                `- Artifact ID: \`${process.env.ARTIFACT_ID || ''}\``,
                `- Artifact digest: \`${process.env.ARTIFACT_DIGEST || ''}\``,
                `- Run: \`${process.env.RUN_URL}\``
              ].join('\n')
            });

      - name: Publish fail-closed signing failure
        if: ${{ always() && (steps.sign.outcome != 'success' || steps.artifact.outcome != 'success' || steps.publish.outcome != 'success') }}
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## EXPERT_PLAN_FAILED',
                '',
                '- Model calls: `0`',
                '- Child dispatch: `false`',
                '- No expert execution was attempted.',
                `- Run: \`${process.env.RUN_URL}\``
              ].join('\n')
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            core.setFailed('expert plan signing failed closed');

      - name: Verify authoritative zero-call signing outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.sign.outcome }}" = "success"
          test "${{ steps.artifact.outcome }}" = "success"
          test "${{ steps.publish.outcome }}" = "success"
          test "$(jq -r '.status' expert-plan-artifacts/plan-preview-receipt.json)" = "PASS"
          test "$(jq -r '.model_calls' expert-plan-artifacts/plan-preview-receipt.json)" = "0"
          test "$(jq -r '.child_dispatch' expert-plan-artifacts/plan-preview-receipt.json)" = "false"
