name: Finalize P1 Governance Manifest

on:
  push:
    branches: [feat/p1-operational-resilience-20260805]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/p1-operational-resilience-20260805
          fetch-depth: 0

      - name: Remove temporary workflow and generate exact manifest
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-p1-manifest.yml
          python tools/generate_governance_release_manifest.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("governance-release-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["governance_version"] = "4.2.0"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit final manifest only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize governance 4.2.0 manifest"
          git push origin HEAD:feat/p1-operational-resilience-20260805
