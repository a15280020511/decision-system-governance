name: CONTROL_PLANE_TOKEN Runtime Scope Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/control-plane-token-scope-runtime-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
    steps:
      - name: Probe exact token scope without persisting forbidden changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("CONTROL_PLANE_TOKEN", "")
          if not token:
              raise SystemExit("CONTROL_PLANE_TOKEN is missing from the governance repository")

          api = "https://api.github.com"
          owner = "a15280020511"
          children = {
              "evidence-data-center": "api-ticket.yml",
              "compute-simulation-center": "compute-ticket.yml",
              "expert-assessment-center": "execution-ticket.yml",
          }
          results = []
          failures = []

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "control-plane-token-scope-probe",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")

          def record(repo, operation, code, expected):
              passed = code in expected
              results.append({
                  "repository": repo,
                  "operation": operation,
                  "http_status": code,
                  "expected": sorted(expected),
                  "passed": passed,
              })
              if not passed:
                  failures.append(f"{repo} {operation}: HTTP {code}, expected {sorted(expected)}")

          for repo, workflow in children.items():
              full = f"{owner}/{repo}"
              code, body = request(
                  "POST",
                  f"/repos/{full}/issues",
                  {
                      "title": "[permission-probe] CONTROL_PLANE_TOKEN least privilege",
                      "body": "Temporary zero-business-call permission probe. This Issue is closed immediately.",
                  },
              )
              record(full, "issues:create", code, {201})
              if code == 201:
                  number = json.loads(body)["number"]
                  close_code, _ = request(
                      "PATCH",
                      f"/repos/{full}/issues/{number}",
                      {"state": "closed", "state_reason": "not_planned"},
                  )
                  record(full, "issues:close", close_code, {200})

              code, _ = request(
                  "PUT",
                  f"/repos/{full}/contents/.permission-probe-must-not-exist",
                  {
                      "message": "permission probe must not commit",
                      "content": "cHJvYmU=",
                      "branch": "permission-probe-nonexistent-branch",
                  },
              )
              record(full, "contents:write", code, {403, 404})

              code, _ = request(
                  "POST",
                  f"/repos/{full}/git/refs",
                  {
                      "ref": "refs/heads/permission-probe-must-not-exist",
                      "sha": "0000000000000000000000000000000000000000",
                  },
              )
              record(full, "git-ref:create", code, {403, 404})

              code, _ = request(
                  "POST",
                  f"/repos/{full}/pulls",
                  {"title": "permission probe must not create PR", "head": "main", "base": "main"},
              )
              record(full, "pull-request:create", code, {403, 404})

              code, _ = request("GET", f"/repos/{full}/actions/secrets")
              record(full, "actions-secrets:list", code, {403, 404})

              code, _ = request(
                  "POST",
                  f"/repos/{full}/actions/workflows/{workflow}/dispatches",
                  {"ref": "permission-probe-nonexistent-ref"},
              )
              record(full, "workflow:dispatch", code, {403, 404})

          governance = f"{owner}/decision-system-governance"
          code, body = request(
              "POST",
              f"/repos/{governance}/issues",
              {
                  "title": "[permission-probe] CONTROL token must not access governance",
                  "body": "This request must be denied because the internal token is child-repository only.",
              },
          )
          record(governance, "issues:create-with-internal-token", code, {403, 404})
          if code == 201:
              number = json.loads(body)["number"]
              request(
                  "PATCH",
                  f"/repos/{governance}/issues/{number}",
                  {"state": "closed", "state_reason": "not_planned"},
              )

          report = {"status": "FAIL" if failures else "PASS", "results": results, "failures": failures}
          print(json.dumps(report, indent=2, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## CONTROL_PLANE_TOKEN Runtime Scope Probe\n\n")
              handle.write(f"Result: **{report['status']}**\n\n")
              for row in results:
                  handle.write(
                      f"- `{row['repository']}` `{row['operation']}` → HTTP `{row['http_status']}` "
                      f"({'PASS' if row['passed'] else 'FAIL'})\n"
                  )
          if failures:
              raise SystemExit("; ".join(failures))
          PY
