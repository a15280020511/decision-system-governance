name: Eight Model Live Pool Diagnostic

on:
  push:
    branches:
      - fix/eight-model-live-pool

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/eight-model-live-pool
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Compare eligible pools without model calls
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          python - <<'PY'
          import importlib.util
          import json
          import os
          import urllib.parse
          from pathlib import Path

          root = Path.cwd()
          selector_path = root / 'governance-copilot' / 'select_expert_team_plan.py'

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              return module

          selector = load('eight_model_pool_selector', selector_path)
          selector.OFFICIAL_INTELLIGENCE_RANK_LIMIT = 150
          token = os.environ['OPENROUTER_API_KEY']
          query = urllib.parse.urlencode({
              'sort': 'intelligence-high-to-low',
              'output_modalities': 'text',
          })
          catalog = selector._fetch_json(f'{selector.MODELS_API}?{query}', token)
          zdr_payload = selector._fetch_json(
              'https://openrouter.ai/api/v1/endpoints/zdr',
              token,
          )
          zdr_rows = zdr_payload.get('data')
          if not isinstance(zdr_rows, list):
              raise SystemExit('ZDR inventory unavailable')
          zdr_keys = {
              (
                  str(row.get('model_id') or '').strip(),
                  str(selector._provider_slug(row) or '').strip(),
              )
              for row in zdr_rows
              if isinstance(row, dict)
          }

          original_flagship = selector._is_general_flagship

          def broad_high_intelligence(identity: str) -> bool:
              lowered = identity.lower()
              return (
                  not selector.EXCLUDED_TIER.search(identity)
                  and not any(
                      marker in lowered
                      for marker in selector.SPECIALIZED_MARKERS
                  )
              )

          def candidates(broad: bool):
              selector._is_general_flagship = (
                  broad_high_intelligence if broad else original_flagship
              )
              try:
                  return selector._catalog_candidates(catalog)
              finally:
                  selector._is_general_flagship = original_flagship

          def qualify(mode: str, broad: bool, minimum_zdr_providers: int):
              qualified = []
              for candidate in candidates(broad):
                  model_id = str(candidate['model_id'])
                  endpoint_payload = selector._fetch_json(
                      selector._endpoint_url(model_id),
                      token,
                  )
                  compatible = selector._compatible_endpoint_inventory(
                      candidate,
                      endpoint_payload,
                      16_384,
                  )
                  zdr = [
                      row
                      for row in compatible
                      if (model_id, str(row.get('provider') or '')) in zdr_keys
                  ]
                  if len(zdr) < minimum_zdr_providers:
                      continue
                  qualified.append({
                      'model': model_id,
                      'company': candidate['company'],
                      'price_rank_usd_per_million': candidate[
                          'price_rank_usd_per_million'
                      ],
                      'official_intelligence_rank': candidate[
                          'official_intelligence_rank'
                      ],
                      'qualified_zdr_provider_count': len(zdr),
                  })
                  if len(qualified) == 8:
                      break
              return {
                  'mode': mode,
                  'count': len(qualified),
                  'distinct_companies': len({
                      row['company'] for row in qualified
                  }),
                  'models': qualified,
              }

          results = [
              qualify('explicit-flagship-zdr2', False, 2),
              qualify('broad-high-intelligence-zdr2', True, 2),
              qualify('explicit-flagship-zdr1', False, 1),
              qualify('broad-high-intelligence-zdr1', True, 1),
          ]
          print('EIGHT_MODEL_POOL_DIAGNOSTIC=' + json.dumps(
              results,
              ensure_ascii=False,
              sort_keys=True,
          ))
          if not any(row['count'] >= 8 for row in results):
              raise SystemExit('no tested qualification mode produced eight models')
          PY
