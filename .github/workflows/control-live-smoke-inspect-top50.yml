name: Control Live Smoke Inspect Top50

on:
  push:
    branches:
      - control/live-smoke-top50-20260807

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Inspect generator CLI and source contracts
        shell: bash
        run: |
          set -euo pipefail
          python governance-copilot/top50_reasoning_pool_extension.py --help > /tmp/top50-help.txt 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import ast, json
          p=Path('governance-copilot/top50_reasoning_pool_extension.py')
          tree=ast.parse(p.read_text(encoding='utf-8'))
          out=[]
          for n in tree.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  out.append({'name':n.name,'args':[a.arg for a in n.args.args]})
          Path('/tmp/top50-signatures.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
          {
            echo '# top50 generator help'; cat /tmp/top50-help.txt; echo; echo '# signatures'; cat /tmp/top50-signatures.json;
          } > CONTROL_TOP50_INSPECT.txt
      - name: Commit inspection result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/control-live-smoke-inspect-top50.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'control: record Top50 generator contract'
          git push origin HEAD:control/live-smoke-top50-20260807
