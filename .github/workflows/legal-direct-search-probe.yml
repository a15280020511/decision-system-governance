name: Legal Direct Search Probe

on:
  push:
    branches:
      - probe/legal-search-direct-20260808
    paths:
      - .github/workflows/legal-direct-search-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Jufa exact search
        shell: bash
        run: |
          cat > /tmp/jufa.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1600,1400','--lang=zh-CN']:
              opts.add_argument(a)
          opts.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0 Safari/537.36')
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(35)
          d.get('https://www.jufaanli.com/Home/BaseSearch/tool'); time.sleep(8)
          inp=d.find_element(By.ID,'searchConObj')
          d.execute_script("""
            const el=arguments[0],v=arguments[1];
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(el,v);
            el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true}));
          """,inp,'劳动争议')
          print('VALUE=',inp.get_attribute('value'))
          els=d.find_elements(By.XPATH,"//*[normalize-space(text())='开始检索']")
          print('START_SEARCH_ELEMENTS=',len(els))
          for i,e in enumerate(els):
              try:
                  print('ELEM',i,'tag=',e.tag_name,'displayed=',e.is_displayed(),'enabled=',e.is_enabled(),'class=',e.get_attribute('class'),'outer=',e.get_attribute('outerHTML')[:1500])
              except Exception as ex: print('ELEM_ERR',i,type(ex).__name__)
          clicked=False
          for e in els:
              try:
                  if e.is_displayed():
                      d.execute_script('arguments[0].click();',e); clicked=True; print('CLICKED_START_SEARCH'); break
              except Exception as ex: print('CLICK_ERR',type(ex).__name__,str(ex)[:200])
          time.sleep(12)
          b=d.find_element(By.TAG_NAME,'body').text
          print('URL=',d.current_url); print('TITLE=',d.title); print('BODY=',b[:7000].replace('\n',' | '))
          print('STATS=',{m:b.count(m) for m in ['劳动争议','案号','法院','裁判日期','登录','注册','验证码','案例','需要登录','认证后']})
          print('CLICKED=',clicked)
          d.quit()
          PY
          python /tmp/jufa.py
