name: Apply True Async Control Patch

on:
  push:
    branches:
      - feature/true-async-control-polling-20260805
    paths:
      - tools/apply_true_async_patch.py
      - tools/apply_true_async_patch_v2.py
      - .github/workflows/apply-true-async-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-true-async-control-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/true-async-control-polling-20260805
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply repository patch
        run: python tools/apply_true_async_patch_v2.py
      - name: Validate asynchronous control contracts
        run: |
          set -euo pipefail
          python -m py_compile control-plane/async_reconcile.py control-plane/control_plane.py security/access_contract.py
          python -m unittest tests/test_async_reconcile.py tests/test_p1_operational_contract.py tests/test_access_contract.py -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
      - name: Preserve generated workflow payloads
        run: |
          mkdir -p generated-async-workflows
          cp .github/workflows/control-plane-ticket.yml generated-async-workflows/control-plane-ticket.yml
          cp .github/workflows/control-plane-reconcile.yml generated-async-workflows/control-plane-reconcile.yml
          git checkout -- .github/workflows/control-plane-ticket.yml .github/workflows/control-plane-reconcile.yml
      - name: Commit tested non-workflow implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-plane security tests CONTROL_PLANE_RUNBOOK.md ASYNC_CONTROL_POLLING.md gpts-knowledge generated-async-workflows
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: add true asynchronous control reconciliation"
          git push origin HEAD:feature/true-async-control-polling-20260805
