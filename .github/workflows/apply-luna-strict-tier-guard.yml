name: Apply Luna Strict-Tier Guard

on:
  push:
    branches:
      - fix/exclude-luna-and-verify-strict-tier

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/exclude-luna-and-verify-strict-tier
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply fail-closed Luna guard
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new)

          path = Path('governance-copilot/select_expert_team_plan.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    r"(flash|mini|nano|micro|small|lite|fast|instant|turbo|haiku|spark|"\n',
              '    r"(luna|flash|mini|nano|micro|small|lite|fast|instant|turbo|haiku|spark|"\n',
              'Luna exclusion',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tools/sign_expert_plan.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '            if "authenticated-zdr-endpoint-qualified" not in evidence:\n',
              '            if "strict-tier+company-highest-intelligence-reasoning-flagship" not in evidence:\n                raise ExpertPlanSigningError(\n                    "model lacks strict-tier reasoning flagship evidence"\n                )\n            if "authenticated-zdr-endpoint-qualified" not in evidence:\n',
              'signer strict-tier evidence',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tools/repair_expert_child_plan.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '            provider_count = row.get("qualified_provider_count")\n',
              '            provider_count = row.get("qualified_provider_count")\n            evidence = str(row.get("selection_evidence") or "")\n',
              'repair evidence field',
          )
          text = replace_once(
              text,
              '            if (\n                isinstance(provider_count, bool)\n',
              '            if "strict-tier+company-highest-intelligence-reasoning-flagship" not in evidence:\n                raise ExpertChildRepairError(\n                    "regenerated model lacks strict-tier reasoning flagship evidence"\n                )\n            if (\n                isinstance(provider_count, bool)\n',
              'repair strict-tier evidence',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Update regression tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_expert_plan_strict_flagship_policy.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_non_reasoning_pro_model_is_rejected(self) -> None:\n'
          lines = (
              '    def test_luna_pro_is_rejected_even_without_another_openai_model(self) -> None:',
              '        rows = [',
              '            model("openai/gpt-5.6-luna-pro", 0.1, 0.6),',
              '            model("other/reasoning-max", 0.2, 0.4),',
              '        ]',
              '        filtered = planner._catalog_candidates({"data": rows})',
              '        self.assertEqual(',
              '            [row["model_id"] for row in filtered],',
              '            ["other/reasoning-max"],',
              '        )',
              '',
              '',
          )
          if marker not in text:
              raise SystemExit('selector test marker missing')
          text = text.replace(marker, '\n'.join(lines) + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_expert_child_plan_repair.py')
          text = path.read_text(encoding='utf-8')
          needle = '                "endpoint_inventory_sha256": hashlib.sha256(\n                    company.encode("utf-8")\n                ).hexdigest(),\n'
          addition = needle + '                "selection_evidence": (\n                    "strict-tier+company-highest-intelligence-reasoning-flagship+"\n                    "price-order+live-exact-endpoint-qualified+"\n                    "authenticated-zdr-endpoint-qualified+minimum-one-zdr-provider-route"\n                ),\n'
          if needle not in text:
              raise SystemExit('repair fixture marker missing')
          text = text.replace(needle, addition, 1)
          text = text.replace(
              'new_plan["selected_models"][0]["model"] = "openai/gpt-5.6-luna-pro"',
              'new_plan["selected_models"][0]["model"] = "openai/gpt-5-pro"',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_expert_plan_preview_workflow.py')
          text = path.read_text(encoding='utf-8')
          needle = '            "model does not satisfy the qualified ZDR provider floor",\n'
          if needle in text and 'model lacks strict-tier reasoning flagship evidence' not in text:
              text = text.replace(
                  needle,
                  needle + '            "model lacks strict-tier reasoning flagship evidence",\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run zero-call target tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_expert_child_plan_repair \
            tests.test_expert_plan_preview_workflow \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_zdr_endpoint_parity -v
      - name: Commit minimal patch
        run: |
          set -euo pipefail
          rm .github/workflows/apply-luna-strict-tier-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance-copilot tools tests .github/workflows
          git commit -m "fix: exclude Luna and verify strict-tier evidence"
          git push origin HEAD:fix/exclude-luna-and-verify-strict-tier
