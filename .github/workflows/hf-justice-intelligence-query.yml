name: Governance PRC Justice Intelligence Query

on:
  pull_request:
    branches: [main]
    paths:
      - "hf-justice-intelligence-gateway/query_report.py"
      - "hf-justice-intelligence-gateway/tests/test_query_report.py"
      - ".github/workflows/hf-justice-intelligence-query.yml"
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-hf-justice-query-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  query:
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event.issue.title == '[hf-justice-query]' || github.event.issue.title == '[hf-justice-report]') &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ github.event_name == 'issues' && secrets.HF_TOKEN || '' }}
      HF_JUSTICE_INTELLIGENCE_DATASET_REPO: ${{ github.event_name == 'issues' && vars.HF_JUSTICE_INTELLIGENCE_DATASET_REPO || '' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-justice-intelligence-gateway/requirements.txt

      - name: Install pinned dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r hf-justice-intelligence-gateway/requirements.txt
          python -m pip check

      - name: Validate query implementation without network
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python -m py_compile hf-justice-intelligence-gateway/query_report.py
          python -m unittest hf-justice-intelligence-gateway/tests/test_query_report.py -v
          git diff --check

      - name: Resolve owner query ticket
        id: prepare
        if: github.event_name == 'issues'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          issue = event.get('issue') or {}
          sender = event.get('sender') or {}
          if sender.get('login') != os.environ['GITHUB_REPOSITORY_OWNER']:
              raise SystemExit('query actor must be repository owner')
          title = issue.get('title')
          body = json.loads(issue.get('body') or '')
          if title == '[hf-justice-query]':
              if set(body) != {'schema_version','query'} or body.get('schema_version') != 'governance-hf-justice-query-ticket-v1':
                  raise SystemExit('invalid query ticket')
              query = body.get('query')
              if not isinstance(query, dict):
                  raise SystemExit('query must be an object')
              allowed = {'days','institution_type','region','signal_type','subject_type','capability_id','technology_term','legal_domain','confidence','limit'}
              if set(query) - allowed:
                  raise SystemExit('unsupported query field')
              print('operation=query')
              print('query_json=' + json.dumps(query, ensure_ascii=False, separators=(',', ':')))
          elif title == '[hf-justice-report]':
              if set(body) != {'schema_version','days'} or body.get('schema_version') != 'governance-hf-justice-report-ticket-v1':
                  raise SystemExit('invalid report ticket')
              days = int(body.get('days') or 0)
              if days not in {7,30,90,180,365,1095}:
                  raise SystemExit('unsupported report window')
              print('operation=report')
              print('days=' + str(days))
          else:
              raise SystemExit('unsupported issue title')
          PY

      - name: Run private derived-intelligence query
        id: execute
        if: github.event_name == 'issues'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf hf-justice-query-run
          if [[ "${{ steps.prepare.outputs.operation }}" == "query" ]]; then
            python hf-justice-intelligence-gateway/query_report.py query \
              --query-json '${{ steps.prepare.outputs.query_json }}' \
              --output-dir hf-justice-query-run
          else
            python hf-justice-intelligence-gateway/query_report.py report \
              --days "${{ steps.prepare.outputs.days }}" \
              --output-dir hf-justice-query-run
          fi

      - name: Build safe response
        if: always() && github.event_name == 'issues'
        run: |
          set -euo pipefail
          if [[ -f hf-justice-query-run/report.md ]]; then
            cp hf-justice-query-run/report.md hf-justice-response.md
          elif [[ -f hf-justice-query-run/query-results.json ]]; then
            python - <<'PY' > hf-justice-response.md
          import json
          from pathlib import Path
          row = json.loads(Path('hf-justice-query-run/query-results.json').read_text(encoding='utf-8'))
          print('## 中国大陆司法衍生情报查询')
          print()
          print(f"- 匹配记录：`{row.get('matched_record_count', 0)}`")
          print('- 原始网页正文：`不返回`')
          print('- 原始来源URL：`不返回`')
          print('- 原始模型回复：`不返回`')
          print()
          for item in row.get('records', [])[:50]:
              print(f"### {item.get('event_date') or item.get('as_of_date')} | {item.get('institution_type')} | {item.get('signal_type')}")
              print(f"- 地区：{item.get('region') or '未标注'}")
              print(f"- 能力：{', '.join(item.get('capability_ids') or []) or '未映射'}")
              print(f"- 技术：{', '.join(item.get('technology_terms') or []) or '未标注'}")
              print(f"- 趋势：{item.get('trend_direction')} / 置信度：{item.get('confidence')}")
              print(f"- 摘要：{item.get('summary')}")
              if item.get('practice_standard_summary'):
                  print(f"- 实践标准：{item['practice_standard_summary']}")
              if item.get('doctrine_or_enforcement_summary'):
                  print(f"- 理论/执行：{item['doctrine_or_enforcement_summary']}")
              print()
          PY
          else
            printf '## 中国大陆司法衍生情报查询\n\n- 状态：`FAILED`\n- 未返回任何原始网页或模型内容。\n' > hf-justice-response.md
          fi
          cat hf-justice-response.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish owner-only query receipt
        if: always() && github.event_name == 'issues'
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@hf-justice-response.md

      - name: Upload query/report artifact
        if: always() && github.event_name == 'issues'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-hf-justice-query-${{ github.run_id }}
          path: |
            hf-justice-query-run/*.json
            hf-justice-query-run/*.md
            hf-justice-response.md
          if-no-files-found: warn
          retention-days: 30

      - name: Mark failed query
        if: always() && github.event_name == 'issues' && steps.execute.outcome != 'success'
        run: exit 1
