name: Live Cheapest Flagships Once

on:
  push:
    branches:
      - test/live-cheapest-flagships

permissions:
  contents: read

jobs:
  rank:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: test/live-cheapest-flagships
          persist-credentials: false

      - name: Read live catalog and rank flagship prices
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          path = Path('governance-copilot/select_expert_team_plan.py')
          spec = importlib.util.spec_from_file_location('live_simple_selector', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load selector')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          rows = module._live_flagship_rows(os.environ['OPENROUTER_API_KEY'])
          chosen = []
          seen_companies = set()
          for row in rows:
              company = row['company']
              if company in seen_companies:
                  continue
              chosen.append(row)
              seen_companies.add(company)
              if len(chosen) == 4:
                  break

          payload = {
              'status': 'PASS',
              'ranking_rule': 'prompt_usd_per_million + completion_usd_per_million ascending',
              'catalog_flagship_count': len(rows),
              'top_10': rows[:10],
              'selected_4_distinct_companies': chosen,
              'model_calls': 0,
          }
          Path('live-cheapest-flagships.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload ranking receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-cheapest-flagships
          path: live-cheapest-flagships.json
          if-no-files-found: error
          retention-days: 3
