name: Finalize Async Governance Manifest

on:
  push:
    branches:
      - feature/true-async-control-polling-20260805
    paths:
      - .github/workflows/finalize-async-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-async-governance-manifest
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/true-async-control-polling-20260805
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Remove temporary workflow and generate exact final manifest
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-async-manifest.yml
          python tools/generate_governance_release_manifest.py \
            --output governance-release-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('governance-release-manifest.json').read_text(encoding='utf-8'))
          assert row['file_count'] == 103, row
          assert row['total_bytes'] == 631579, row
          assert len(row['files']) == 103, row
          PY
          git diff --check
      - name: Commit exact manifest and self-removal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/finalize-async-manifest.yml governance-release-manifest.json
          git commit -m "chore: finalize exact async governance release manifest"
          git push origin HEAD:feature/true-async-control-polling-20260805
