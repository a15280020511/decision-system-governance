name: Validate Main Provenance and Repository Protection

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/main-provenance-and-repository-protection.yml"
      - ".github/workflows/openrouter-selector-resilience.yml"
      - ".github/workflows/openrouter-selector-security.yml"
      - "REPOSITORY_PROTECTION_POLICY.md"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-provenance-and-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('.github/workflows/openrouter-selector-resilience.yml'),
              Path('.github/workflows/openrouter-selector-security.yml'),
              Path('.github/workflows/main-provenance-and-repository-protection.yml'),
          )
          merged_test_branch = '/'.join(('test', 'openrouter-high-level-price-selection'))
          forbidden_permissions = tuple(
              f'{scope}: ' + 'write'
              for scope in ('contents', 'actions', 'issues', 'pull-requests', 'id-token')
          )
          for path in paths:
              text = path.read_text('utf-8').lower()
              if merged_test_branch in text:
                  raise SystemExit(f'merged test branch trigger remains in {path}')
              for marker in forbidden_permissions:
                  if marker in text:
                      raise SystemExit(f'write permission {marker} found in {path}')
          guard = paths[2].read_text('utf-8').lower()
          required = (
              'pull-requests: read',
              'commits/{sha}/pulls',
              'schedule:',
              'workflow_dispatch:',
              'branches:\n      - main',
          )
          for marker in required:
              if marker not in guard:
                  raise SystemExit(f'missing provenance guard marker: {marker}')
          print('MAIN_PROVENANCE_STATIC_CONTRACT_PASS')
          PY

  main-provenance:
    if: github.event_name == 'push'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Require merged pull request provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['COMMIT_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/commits/{sha}/pulls'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'decision-system-main-provenance-guard/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pulls = json.loads(response.read().decode('utf-8'))
          if not isinstance(pulls, list):
              raise SystemExit('associated pull request response is not a list')
          accepted = []
          for pull in pulls:
              if not isinstance(pull, dict):
                  continue
              base = pull.get('base') if isinstance(pull.get('base'), dict) else {}
              if pull.get('merged_at') and base.get('ref') == 'main':
                  accepted.append(
                      {
                          'number': pull.get('number'),
                          'merged_at': pull.get('merged_at'),
                          'merge_commit_sha': pull.get('merge_commit_sha'),
                      }
                  )
          if not accepted:
              raise SystemExit(
                  f'main commit {sha} has no associated merged pull request targeting main'
              )
          print(json.dumps({'status': 'MAIN_PR_PROVENANCE_PASS', 'commit': sha, 'pull_requests': accepted}, sort_keys=True))
          PY

  repository-protection-audit:
    if: github.event_name != 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Audit live main protection and rulesets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']

          def get_json(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'decision-system-repository-protection-audit/1.0',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          branch = get_json('branches/main')
          protected = bool(branch.get('protected')) if isinstance(branch, dict) else False
          rulesets = []
          rulesets_access = True
          try:
              payload = get_json('rulesets?includes_parents=true')
              if isinstance(payload, list):
                  rulesets = payload
          except urllib.error.HTTPError as exc:
              if exc.code in {403, 404}:
                  rulesets_access = False
              else:
                  raise
          active_rulesets = [
              row for row in rulesets
              if isinstance(row, dict) and row.get('enforcement') == 'active'
          ]
          status = 'REPOSITORY_PROTECTION_PASS' if protected and active_rulesets else 'ADVISORY_UNPROTECTED'
          summary = {
              'status': status,
              'repository': repository,
              'branch': 'main',
              'branch_protected': protected,
              'rulesets_accessible': rulesets_access,
              'active_ruleset_count': len(active_rulesets),
              'required_manual_action': status != 'REPOSITORY_PROTECTION_PASS',
          }
          print(json.dumps(summary, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('## Repository protection audit\n\n')
              handle.write('```json\n')
              handle.write(json.dumps(summary, indent=2, sort_keys=True))
              handle.write('\n```\n')
          if status != 'REPOSITORY_PROTECTION_PASS':
              print('::warning::main is not protected by an active repository ruleset; enable the required settings in REPOSITORY_PROTECTION_POLICY.md')
          PY
