name: Validate OpenRouter Governance Selector Resilience

on:
  push:
    branches:
      - main
    paths:
      - "governance-copilot/**"
      - "tests/test_openrouter_governance_selector.py"
      - "tests/test_openrouter_task_cost_ranking.py"
      - "tests/test_openrouter_selector_static_safety.py"
      - "tests/stress_openrouter_governance_selector.py"
      - ".github/workflows/openrouter-selector-resilience.yml"
      - ".github/workflows/openrouter-selector-security.yml"
      - "MODEL_ORCHESTRATION_POLICY.md"
  pull_request:
    branches:
      - main
    paths:
      - "governance-copilot/**"
      - "tests/test_openrouter_governance_selector.py"
      - "tests/test_openrouter_task_cost_ranking.py"
      - "tests/test_openrouter_selector_static_safety.py"
      - "tests/stress_openrouter_governance_selector.py"
      - ".github/workflows/openrouter-selector-resilience.yml"
      - ".github/workflows/openrouter-selector-security.yml"
      - "MODEL_ORCHESTRATION_POLICY.md"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-selector-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: offline-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile selector ranker and tests
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m compileall -q \
            governance-copilot \
            tests/test_openrouter_governance_selector.py \
            tests/test_openrouter_task_cost_ranking.py \
            tests/test_openrouter_selector_static_safety.py \
            tests/stress_openrouter_governance_selector.py

      - name: Run deterministic selector regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_openrouter_governance_selector.py

      - name: Run deterministic task-cost regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_openrouter_task_cost_ranking.py

      - name: Run randomized complex-environment stress test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selector-validation
          python tests/stress_openrouter_governance_selector.py \
            --iterations 750 \
            --seed 20260805 | tee selector-validation/stress-${{ matrix.os }}.json

      - name: Verify missing key fails closed
        shell: bash
        run: |
          set -euo pipefail
          if env -u OPENROUTER_API_KEY python governance-copilot/select_paid_governance_flagship_model.py \
            --output-dir selector-validation/no-key; then
            echo "selector unexpectedly succeeded without OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Upload offline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openrouter-selector-offline-${{ matrix.os }}-${{ github.run_id }}
          path: selector-validation/
          if-no-files-found: error
          retention-days: 14

  live-contract-validation:
    name: live-openrouter-contract
    needs: offline-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOVERNANCE_EXPECTED_PROMPT_TOKENS: "10000"
      GOVERNANCE_EXPECTED_COMPLETION_TOKENS: "2000"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"

      - name: Run three independent live catalog and task-cost selections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-selection
          for attempt in 1 2 3; do
            selected=false
            for network_try in 1 2 3 4; do
              rm -rf "live-selection/${attempt}/flagships"
              mkdir -p "live-selection/${attempt}"
              error_log="live-selection/${attempt}/selector-error-${network_try}.log"
              if python governance-copilot/select_paid_governance_flagship_model.py \
                --output-dir "live-selection/${attempt}/flagships" 2>"${error_log}"; then
                rm -f "${error_log}"
                selected=true
                break
              fi

              if ! grep -Eiq \
                'HTTP (408|429|5[0-9]{2})|timed? ?out|timeout|temporar|network|urlerror|connection reset' \
                "${error_log}"; then
                cat "${error_log}" >&2
                exit 1
              fi
              if [[ "${network_try}" -ge 4 ]]; then
                cat "${error_log}" >&2
                exit 1
              fi
              sleep $((2 ** (network_try - 1)))
            done
            test "${selected}" = true

            python governance-copilot/rank_flagships_by_task_cost.py \
              --input "live-selection/${attempt}/flagships/selection.json" \
              --output-dir "live-selection/${attempt}/task-cost" \
              --expected-prompt-tokens "${GOVERNANCE_EXPECTED_PROMPT_TOKENS}" \
              --expected-completion-tokens "${GOVERNANCE_EXPECTED_COMPLETION_TOKENS}"
          done

      - name: Validate live schemas safety cost order and repeatability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          raw_required = {
              "schema_version",
              "status",
              "cheapest_paid_flagship_candidates",
              "paid_flagship_count",
              "model_calls",
              "estimated_model_cost_usd",
              "secret_values_exposed",
          }
          cost_required = {
              "schema_version",
              "status",
              "selected_model",
              "ranked_paid_flagship_candidates",
              "task_cost_profile",
              "paid_flagship_count",
              "model_calls",
              "estimated_model_cost_usd",
              "secret_values_exposed",
          }
          specialized = (
              "coder", "code-", "-code", "content-safety", "safety",
              "guard", "embedding", "embed", "rerank", "moderation",
          )
          snapshots = []
          receipts = []
          for attempt in (1, 2, 3):
              raw_path = Path("live-selection") / str(attempt) / "flagships" / "selection.json"
              cost_path = Path("live-selection") / str(attempt) / "task-cost" / "cost-selection.json"
              raw = json.loads(raw_path.read_text("utf-8"))
              cost = json.loads(cost_path.read_text("utf-8"))
              raw_missing = sorted(raw_required - raw.keys())
              cost_missing = sorted(cost_required - cost.keys())
              if raw_missing or cost_missing:
                  raise SystemExit(
                      f"attempt {attempt}: missing raw={raw_missing} cost={cost_missing}"
                  )
              raw_candidates = raw["cheapest_paid_flagship_candidates"]
              ranked = cost["ranked_paid_flagship_candidates"]
              if not isinstance(raw_candidates, list) or not raw_candidates:
                  raise SystemExit(f"attempt {attempt}: empty flagship list")
              if not isinstance(ranked, list) or not ranked:
                  raise SystemExit(f"attempt {attempt}: empty cost ranking")
              if raw["paid_flagship_count"] != len(raw_candidates):
                  raise SystemExit(f"attempt {attempt}: raw candidate count mismatch")
              if cost["paid_flagship_count"] != len(ranked):
                  raise SystemExit(f"attempt {attempt}: cost candidate count mismatch")
              raw_ids = {str(row.get("model_id") or "") for row in raw_candidates}
              ranked_ids = [str(row.get("model_id") or "") for row in ranked]
              if raw_ids != set(ranked_ids):
                  raise SystemExit(f"attempt {attempt}: cost rank changed flagship membership")
              if cost["selected_model"] != ranked[0]:
                  raise SystemExit(f"attempt {attempt}: selected model is not cheapest")
              costs = [float(row["estimated_task_cost_usd"]) for row in ranked]
              if costs != sorted(costs):
                  raise SystemExit(f"attempt {attempt}: estimated costs are not ascending")
              profile = cost["task_cost_profile"]
              if profile != {
                  "expected_prompt_tokens": 10000,
                  "expected_completion_tokens": 2000,
              }:
                  raise SystemExit(f"attempt {attempt}: unexpected task cost profile")
              if raw["model_calls"] != 0 or cost["model_calls"] != 0:
                  raise SystemExit(f"attempt {attempt}: unexpected model inference")
              if raw["estimated_model_cost_usd"] != 0 or cost["estimated_model_cost_usd"] != 0:
                  raise SystemExit(f"attempt {attempt}: selector or ranker incurred cost")
              if raw["secret_values_exposed"] is not False or cost["secret_values_exposed"] is not False:
                  raise SystemExit(f"attempt {attempt}: secret exposure flag is not false")
              if any(
                  any(marker in model_id.lower() for marker in specialized)
                  for model_id in ranked_ids
              ):
                  raise SystemExit(f"attempt {attempt}: specialized model leaked")
              stable_view = {
                  "selected_model": cost["selected_model"].get("model_id"),
                  "selected_estimated_task_cost_usd": cost["selected_model"].get(
                      "estimated_task_cost_usd"
                  ),
                  "candidate_ids": ranked_ids,
                  "candidate_costs": costs,
                  "task_cost_profile": profile,
                  "benchmark_meta": raw.get("benchmark_meta"),
                  "models_catalog_count": raw.get("models_catalog_count"),
                  "benchmark_catalog_count": raw.get("benchmark_catalog_count"),
              }
              encoded = json.dumps(
                  stable_view, sort_keys=True, separators=(",", ":")
              ).encode()
              snapshots.append(hashlib.sha256(encoded).hexdigest())
              receipts.append(stable_view)
          if len(set(snapshots)) != 1:
              Path("live-selection/repeatability-diff.json").write_text(
                  json.dumps(receipts, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  "utf-8",
              )
              raise SystemExit("three immediate task-cost selections were not identical")
          summary = {
              "status": "LIVE_TASK_COST_REPEATABILITY_PASS",
              "attempts": 3,
              "snapshot_sha256": snapshots[0],
              "selected_model": receipts[0]["selected_model"],
              "selected_estimated_task_cost_usd": receipts[0][
                  "selected_estimated_task_cost_usd"
              ],
              "task_cost_profile": receipts[0]["task_cost_profile"],
              "candidate_count": len(receipts[0]["candidate_ids"]),
              "model_calls": 0,
              "estimated_model_cost_usd": 0,
          }
          Path("live-selection/validation-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              "utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload live evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openrouter-selector-live-${{ github.run_id }}
          path: live-selection/
          if-no-files-found: error
          retention-days: 14
