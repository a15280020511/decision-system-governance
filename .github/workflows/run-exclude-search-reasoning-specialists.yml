name: Run Search Specialist Exclusion

on:
  push:
    branches:
      - "fix/exclude-search-reasoning-specialists"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "fix/exclude-search-reasoning-specialists"
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Apply specialist exclusion
        run: python tools/apply_exclude_search_reasoning_specialists.py
      - name: Run zero-call tests
        run: |
          set -euo pipefail
          python -m compileall -q governance-copilot tests
          python -m unittest discover -s tests -p 'test_expert_plan_strict_flagship_policy.py' -v
          python -m unittest discover -s tests -p 'test_eight_model_ordered_recovery.py' -v
          python -m unittest discover -s tests -p 'test_expert_intelligence_ranked_roles.py' -v
          python -m unittest discover -s tests -p 'test_governance_recovery_budget.py' -v
      - name: Commit source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            governance-copilot/select_expert_team_plan.py \
            governance-copilot/expert_task_envelope.py \
            tests/test_expert_plan_strict_flagship_policy.py; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            governance-copilot/select_expert_team_plan.py \
            governance-copilot/expert_task_envelope.py \
            tests/test_expert_plan_strict_flagship_policy.py
          git commit -m "fix: exclude search specialists from reasoning flagships"
          git push origin HEAD:fix/exclude-search-reasoning-specialists
