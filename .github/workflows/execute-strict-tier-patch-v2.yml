name: Execute Strict Flagship Tier Patch V2

on:
  push:
    branches:
      - fix/strict-reasoning-flagship-tier

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/strict-reasoning-flagship-tier
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Apply production contract patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-strict-reasoning-flagship-tier.yml').read_text(encoding='utf-8')
          block = source.split('      - name: Tighten flagship and reasoning contract\n', 1)[1]
          block = block.split('      - name: Update deterministic tests\n', 1)[0]
          block = block.split('        run: |\n', 1)[1]
          Path('/tmp/strict-contract.sh').write_text(textwrap.dedent(block), encoding='utf-8')
          PY
          bash /tmp/strict-contract.sh
      - name: Patch deterministic tests safely
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_expert_plan_strict_flagship_policy.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'company-highest-intelligence-stable-paid-general-reasoning-model',
              'company-highest-intelligence-explicit-tier-reasoning-flagship',
          )
          text = text.replace('model("openai/gpt-5", 1.0, 4.0)', 'model("openai/gpt-5.6-sol-pro", 1.0, 4.0)', 1)
          text = text.replace('self.assertIn("openai/gpt-5", ids)', 'self.assertIn("openai/gpt-5.6-sol-pro", ids)', 1)
          text = text.replace('                "openai/gpt-5",', '                "openai/gpt-5.6-sol-pro",', 1)
          text = text.replace('model("third/general-reasoner", 0.3, 0.5)', 'model("third/general-max", 0.3, 0.5)', 1)
          text = text.replace('["third/general-reasoner"]', '["third/general-max"]', 1)
          marker = '    def test_live_catalog_request_requires_reasoning_parameter(self) -> None:\n'
          lines = (
              '    def test_reasoning_models_without_explicit_flagship_tier_are_rejected(self) -> None:',
              '        rows = [',
              '            model("google/gemma-4-31b-it", 0.1, 0.35),',
              '            model("tencent/hunyuan-a13b-instruct", 0.14, 0.57),',
              '            model("inception/mercury-2", 0.25, 0.75),',
              '            model("google/gemini-2.5-pro", 1.25, 10.0),',
              '        ]',
              '        filtered = planner._catalog_candidates({"data": rows})',
              '        self.assertEqual(',
              '            [row["model_id"] for row in filtered],',
              '            ["google/gemini-2.5-pro"],',
              '        )',
              '',
              '',
          )
          inserted = '\n'.join(lines)
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          text = text.replace(marker, inserted + marker, 1)
          text = text.replace(
              '"highest-intelligence-model-per-company-as-flagship"',
              '"highest-intelligence-explicit-tier-model-per-company-as-flagship"',
              1,
          )
          text = text.replace(
              '"one-highest-intelligence-reasoning-flagship-per-company-then-price-rank"',
              '"one-highest-intelligence-explicit-tier-reasoning-flagship-per-company-then-price-rank"',
              1,
          )
          path.write_text(text, encoding='utf-8')

          for filename in ('tests/test_eight_model_ordered_recovery.py', 'tests/test_expert_zdr_endpoint_parity.py'):
              path = Path(filename)
              value = path.read_text(encoding='utf-8')
              value = value.replace(
                  'company-highest-intelligence-reasoning-flagship+price-order+',
                  'company-highest-intelligence-explicit-tier-reasoning-flagship+price-order+',
              )
              value = value.replace(
                  'company-highest-intelligence-stable-paid-general-reasoning-model',
                  'company-highest-intelligence-explicit-tier-reasoning-flagship',
              )
              path.write_text(value, encoding='utf-8')

          path = Path('tests/test_expert_child_plan_repair.py')
          value = path.read_text(encoding='utf-8')
          needle = '                "endpoint_inventory_sha256": hashlib.sha256(\n                    company.encode("utf-8")\n                ).hexdigest(),\n'
          addition = needle + '                "selection_evidence": (\n                    "company-highest-intelligence-explicit-tier-reasoning-flagship+"\n                    "price-order+live-exact-endpoint-qualified+"\n                    "authenticated-zdr-endpoint-qualified+minimum-one-zdr-provider-route"\n                ),\n'
          if needle not in value:
              raise SystemExit('repair fixture endpoint hash marker missing')
          value = value.replace(needle, addition, 1)
          path.write_text(value, encoding='utf-8')
          PY
      - name: Run zero-call targeted tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_expert_plan_strict_flagship_policy \
            tests.test_eight_model_ordered_recovery \
            tests.test_expert_zdr_endpoint_parity \
            tests.test_expert_child_plan_repair \
            tests.test_expert_plan_preview_workflow -v
      - name: Commit patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-strict-reasoning-flagship-tier.yml .github/workflows/execute-strict-tier-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance-copilot tools tests .github/workflows
          git commit -m "fix: require explicit-tier reasoning flagships"
          git push origin HEAD:fix/strict-reasoning-flagship-tier
