name: Apply Frozen Standby Policy

on:
  push:
    branches:
      - fix/strict-eight-model-standby-vendors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/strict-eight-model-standby-vendors
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Patch frozen policy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('governance-copilot/expert_task_envelope.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "price-ascending -> distinct-primary-companies -> unique-recovery-models"\n'''
          new = '''                "price-ascending -> primary-excludes-governance-vendors -> "\n                "distinct-primary-companies -> unique-recovery-models"\n'''
          if old not in text:
              raise SystemExit('missing frozen policy target')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-envelope-standby-policy.yml').unlink()
          PY
      - name: Commit frozen policy
        run: |
          set -euo pipefail
          branch='fix/strict-eight-model-standby-vendors'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: freeze standby-only governance vendor policy'
          for attempt in 1 2 3; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
