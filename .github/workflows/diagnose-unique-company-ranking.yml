name: Diagnose Unique Company Ranking

on:
  push:
    branches:
      - fix/unique-company-live-ranking

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Inspect live OpenRouter catalog without model calls
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          path = Path('governance-copilot/select_expert_team_plan.py')
          spec = importlib.util.spec_from_file_location('selector', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load selector')
          selector = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(selector)

          token = os.environ.get('OPENROUTER_API_KEY', '')
          if not token:
              raise SystemExit('OPENROUTER_API_KEY missing')
          candidates = selector._live_flagship_rows(token)
          zdr_payload = selector._fetch_json('https://openrouter.ai/api/v1/endpoints/zdr', token)
          zdr_rows = zdr_payload.get('data')
          if not isinstance(zdr_rows, list):
              raise SystemExit('invalid ZDR inventory')
          zdr = {
              (str(row.get('model_id') or '').strip(), str(selector._provider_slug(row) or '').strip())
              for row in zdr_rows if isinstance(row, dict)
          }
          required_context = 16384
          qualified = []
          for candidate in candidates:
              model_id = str(candidate['model_id'])
              payload = selector._fetch_json(selector._endpoint_url(model_id), token)
              compatible = selector._compatible_endpoint_inventory(candidate, payload, required_context)
              zdr_compatible = [row for row in compatible if (model_id, str(row.get('provider') or '')) in zdr]
              if not zdr_compatible:
                  continue
              qualified.append({
                  'model': model_id,
                  'company': str(candidate['company']),
                  'price': float(candidate['price_rank_usd_per_million']),
                  'zdr_provider_count': len(zdr_compatible),
                  'official_rank': int(candidate['official_intelligence_rank']),
              })

          def unique_company(min_providers: int):
              seen = set()
              rows = []
              for row in qualified:
                  if row['zdr_provider_count'] < min_providers or row['company'] in seen:
                      continue
                  seen.add(row['company'])
                  rows.append(row)
              return rows

          report = {
              'model_calls': 0,
              'source': 'live-openrouter-models-endpoints-zdr',
              'strict_zdr_two_provider_unique_companies': unique_company(2),
              'strict_zdr_one_provider_unique_companies': unique_company(1),
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
