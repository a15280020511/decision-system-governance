name: Validate and Run Governance Compute Baseline Gateway

on:
  pull_request:
    paths:
      - "control-plane/topology-contract.json"
      - "compute-baseline-gateway/**"
      - ".github/workflows/compute-baseline-gateway.yml"
      - "ARCHITECTURE.md"
      - "THREE_CENTER_CONTRACT.md"
      - "SECURITY_BOUNDARIES.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "control-plane/topology-contract.json"
      - "compute-baseline-gateway/**"
      - ".github/workflows/compute-baseline-gateway.yml"
      - "ARCHITECTURE.md"
      - "THREE_CENTER_CONTRACT.md"
      - "SECURITY_BOUNDARIES.md"
      - "README.md"
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-compute-baseline-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner && github.event.issue.title == '[baseline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-baseline-gateway/requirements.txt

      - name: Install pinned gateway dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-baseline-gateway/requirements.txt
          python -m pip check

      - name: Compile, test and validate topology
        run: |
          set -euo pipefail
          python -m py_compile compute-baseline-gateway/gateway.py
          python -m unittest compute-baseline-gateway/tests/test_gateway.py -v
          python compute-baseline-gateway/gateway.py validate \
            --output-dir baseline-gateway-validation
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('baseline-gateway-validation/receipt.json').read_text(encoding='utf-8'))
          assert row['status'] == 'BASELINE_GATEWAY_CONTRACT_VALIDATED'
          assert row['storage_gateway_owner'] == 'a15280020511/decision-system-governance'
          assert row['business_center_hf_tokens_allowed'] is False
          assert row['secret_values_exposed'] is False
          assert row['model_calls'] == 0
          PY
          git diff --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-baseline-validation-${{ github.run_id }}
          path: baseline-gateway-validation/
          if-no-files-found: error
          retention-days: 30

  execute:
    if: >-
      always() &&
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == '[baseline]' &&
      needs.validate.result == 'success'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_NUMERIC_BASELINE_DATASET_REPO: ${{ vars.HF_NUMERIC_BASELINE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-baseline-gateway/requirements.txt

      - name: Install pinned gateway dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-baseline-gateway/requirements.txt
          python -m pip check

      - name: Parse and authorize governance ticket
        id: prepare
        continue-on-error: true
        run: |
          python compute-baseline-gateway/gateway.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir baseline-gateway-run

      - name: Check private baseline health
        id: health
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.operation == 'health'
        continue-on-error: true
        run: |
          python compute-baseline-gateway/gateway.py health \
            --output-dir baseline-gateway-run

      - name: Download immutable evidence Artifact
        id: download
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.operation == 'ingest_evidence_artifact'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BASELINE_TRANSFER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p baseline-inbound
          gh run download "${{ steps.prepare.outputs.source_run_id }}" \
            --repo "${{ steps.prepare.outputs.source_repository }}" \
            --name "${{ steps.prepare.outputs.artifact_name }}" \
            --dir baseline-inbound

      - name: Verify and ingest numeric Artifact
        id: ingest
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          python compute-baseline-gateway/gateway.py ingest \
            --input-dir baseline-inbound \
            --expected-manifest-sha256 "${{ steps.prepare.outputs.expected_manifest_sha256 }}" \
            --output-dir baseline-gateway-run

      - name: Render gateway receipt
        if: always()
        run: |
          python compute-baseline-gateway/gateway.py render \
            --output-dir baseline-gateway-run > baseline-gateway-comment.md || true
          cat baseline-gateway-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish governance receipt
        if: always()
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@baseline-gateway-comment.md

      - name: Upload safe gateway evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-baseline-gateway-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            baseline-gateway-run/*.json
            baseline-gateway-comment.md
          if-no-files-found: warn
          retention-days: 90

      - name: Mark rejected or failed execution
        if: >-
          always() &&
          (steps.prepare.outcome != 'success' ||
           (steps.prepare.outputs.operation == 'health' && steps.health.outcome != 'success') ||
           (steps.prepare.outputs.operation == 'ingest_evidence_artifact' &&
            (steps.download.outcome != 'success' || steps.ingest.outcome != 'success')))
        run: exit 1
