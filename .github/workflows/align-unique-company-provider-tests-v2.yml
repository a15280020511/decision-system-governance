name: Align Unique Company Provider Tests V2

on:
  push:
    branches:
      - fix/unique-company-live-ranking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/unique-company-live-ranking
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Align source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rewrite(path, transform):
              file = Path(path)
              before = file.read_text(encoding='utf-8')
              after = transform(before)
              if after == before:
                  raise SystemExit(f'no change made to {path}')
              file.write_text(after, encoding='utf-8')

          def envelope(text):
              text = text.replace(
                  'provider redundancy floor, role assignment, and an\nordered governance-approved recovery reserve. The price-minimal distinct-company\nset is selected first;',
                  'ZDR provider floor, role assignment, and an\nordered governance-approved recovery reserve. The live price ranking keeps one\ncheapest qualified flagship per company;',
              )
              text = text.replace('price-ranked, model-distinct standby models.', 'price-ranked, company-distinct standby models.')
              text = text.replace('ranked model does not satisfy the provider redundancy floor', 'ranked model does not satisfy the ZDR provider floor')
              text = text.replace('authenticated-zdr-endpoint-qualified+two-provider-redundancy', 'authenticated-zdr-endpoint-qualified+minimum-one-zdr-provider-route')
              return text.replace('openrouter-official-intelligence-top-150', 'openrouter-official-intelligence-top-1000')

          rewrite('governance-copilot/expert_task_envelope.py', envelope)
          rewrite(
              'governance-copilot/select_expert_team_plan.py',
              lambda text: text.replace('openrouter-official-intelligence-top-150', 'openrouter-official-intelligence-top-1000'),
          )

          def repair_test(text):
              pattern = r'    def test_verify_repair_rejects_single_provider_models\(self\) -> None:\n.*?(?=    def test_verify_repair_rejects_preproduction_context_floor)'
              replacement = '''    def test_verify_repair_accepts_single_zdr_provider_models(self) -> None:\n        source = source_ticket()\n        repaired = dict(source)\n        new_plan = plan(repaired, provider_count=1)\n        repaired["governance_model_plan"] = new_plan\n        repair.verify_repair(source, repaired, new_plan)\n\n'''
              return re.sub(pattern, replacement, text, flags=re.S)

          rewrite('tests/test_expert_child_plan_repair.py', repair_test)

          def compatibility(text):
              text = text.replace(
                  'RUNTIME.EXPERT_SELECTOR.MINIMUM_QUALIFIED_PROVIDER_COUNT,\n            2,',
                  'RUNTIME.EXPERT_SELECTOR.MINIMUM_QUALIFIED_PROVIDER_COUNT,\n            1,',
              )
              text = text.replace(
                  'REPAIR.SELECTOR.MINIMUM_QUALIFIED_PROVIDER_COUNT,\n            2,',
                  'REPAIR.SELECTOR.MINIMUM_QUALIFIED_PROVIDER_COUNT,\n            1,',
              )
              pattern = r'    def test_single_provider_candidate_is_rejected\(self\) -> None:\n.*?(?=    def test_two_provider_candidate_is_accepted)'
              replacement = '''    def test_single_zdr_provider_candidate_is_accepted(self) -> None:\n        selector = SimpleNamespace(\n            _qualify_candidate=lambda candidate, token, context: {\n                **candidate,\n                "qualified_provider_count": 1,\n            }\n        )\n        ENVELOPE.patch_selector(selector)\n        qualified = selector._qualify_candidate({"model_id": "a/pro"}, "", 16_384)\n        self.assertIsNotNone(qualified)\n        assert qualified is not None\n        self.assertEqual(qualified["qualified_provider_count"], 1)\n\n    def test_zero_provider_candidate_is_rejected(self) -> None:\n        selector = SimpleNamespace(\n            _qualify_candidate=lambda candidate, token, context: {\n                **candidate,\n                "qualified_provider_count": 0,\n            }\n        )\n        ENVELOPE.patch_selector(selector)\n        self.assertIsNone(\n            selector._qualify_candidate({"model_id": "a/pro"}, "", 16_384)\n        )\n\n'''
              return re.sub(pattern, replacement, text, flags=re.S)

          rewrite('tests/test_expert_task_envelope_compatibility.py', compatibility)

          def zdr_test(text):
              text = text.replace('test_single_zdr_route_does_not_satisfy_redundancy_floor', 'test_single_zdr_route_satisfies_provider_floor')
              pattern = r'        self\.assertIsNone\(\n            selector\._qualify_candidate\(\n                candidate\("vendor/model-pro", 1\), "secret", 16_384\n            \)\n        \)\n'
              replacement = '''        qualified = selector._qualify_candidate(\n            candidate("vendor/model-pro", 1), "secret", 16_384\n        )\n        self.assertIsNotNone(qualified)\n        assert qualified is not None\n        self.assertEqual(qualified["qualified_provider_count"], 1)\n'''
              text = re.sub(pattern, replacement, text, count=1)
              text = text.replace('test_plan_records_zdr_redundancy_and_recomputes_digest', 'test_plan_records_zdr_provider_floor_and_recomputes_digest')
              text = text.replace('minimum-two-provider-routes', 'minimum-one-zdr-provider-route')
              text = text.replace('self.assertGreaterEqual(row["qualified_provider_count"], 2)', 'self.assertGreaterEqual(row["qualified_provider_count"], 1)')
              return text.replace('two-provider-redundancy', 'minimum-one-zdr-provider-route')

          rewrite('tests/test_expert_zdr_endpoint_parity.py', zdr_test)
          Path('.github/workflows/align-unique-company-provider-tests-v2.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align single-provider ZDR contract'
          git push origin HEAD:fix/unique-company-live-ranking
