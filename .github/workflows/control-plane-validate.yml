name: Control Plane Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile governance control code
        run: |
          python -m py_compile control-plane/control_plane.py
          python -m py_compile control-plane/resilient_http.py
          python -m py_compile control-plane/resilient_control.py
          python -m py_compile control-plane/gpts_reliability.py
          python -m py_compile control-plane/ingress_ack.py
          python -m py_compile control-plane/async_reconcile.py
          python -m py_compile control-plane/deferred_poll.py
          python -m py_compile control-plane/deferred_reconcile.py
          python -m py_compile security/governance_health_check.py
          python -m py_compile security/gpts_ingress_canary.py
          python -m py_compile security/governance_issue_guard.py
          python -m py_compile security/access_contract.py

      - name: Run deterministic governance tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate governed external integrations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          serverchan = json.loads(Path("integrations/serverchan/integration.json").read_text(encoding="utf-8"))
          expected = {
              "id": "serverchan",
              "installation_status": "installed",
              "activation_status": "enabled",
              "implementation_status": "implemented",
          }
          for key, value in expected.items():
              if serverchan.get(key) != value:
                  raise SystemExit(f"ServerChan integration field mismatch: {key}")
          if serverchan.get("required_secrets") != ["SERVERCHAN_SENDKEY"]:
              raise SystemExit("ServerChan must require exactly SERVERCHAN_SENDKEY")
          required_entries = {
              ".github/workflows/governance-failure-notify.yml",
              "tools/serverchan_notify.py",
          }
          if set(serverchan.get("runtime_entrypoints") or []) != required_entries:
              raise SystemExit("ServerChan runtime entrypoints mismatch")
          if not serverchan.get("network_endpoints"):
              raise SystemExit("ServerChan endpoint templates missing")

          expected_integrations = {
              "osv": ("enabled", []),
              "depsdev": ("enabled", []),
              "cisa-kev": ("enabled", []),
              "healthchecks": ("pending_secret", ["HEALTHCHECKS_PING_URL"]),
          }
          for integration_id, (activation, secrets) in expected_integrations.items():
              data = json.loads(Path(f"integrations/{integration_id}/integration.json").read_text(encoding="utf-8"))
              if data.get("id") != integration_id:
                  raise SystemExit(f"integration id mismatch: {integration_id}")
              if data.get("installation_status") != "installed":
                  raise SystemExit(f"integration not installed: {integration_id}")
              if data.get("activation_status") != activation:
                  raise SystemExit(f"activation mismatch: {integration_id}")
              if data.get("implementation_status") != "implemented":
                  raise SystemExit(f"implementation mismatch: {integration_id}")
              if data.get("required_secrets") != secrets:
                  raise SystemExit(f"secret contract mismatch: {integration_id}")
          PY

      - name: Validate P0 and P1 resilience contract
        run: |
          python - <<'PY'
          from pathlib import Path
          openapi = Path("gpts-action/openapi.yaml").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/control-plane-ticket.yml").read_text(encoding="utf-8")
          ingress_workflow = Path(".github/workflows/gpts-ingress-ack.yml").read_text(encoding="utf-8")
          canary_workflow = Path(".github/workflows/gpts-ingress-canary.yml").read_text(encoding="utf-8")
          reconcile = Path(".github/workflows/control-plane-reconcile.yml").read_text(encoding="utf-8")
          health_workflow = Path(".github/workflows/governance-health-check.yml").read_text(encoding="utf-8")
          runtime = Path("control-plane/control_plane.py").read_text(encoding="utf-8")
          reliability = Path("control-plane/gpts_reliability.py").read_text(encoding="utf-8")
          ingress_runtime = Path("control-plane/ingress_ack.py").read_text(encoding="utf-8")
          resilient_http = Path("control-plane/resilient_http.py").read_text(encoding="utf-8")
          resilient_control = Path("control-plane/resilient_control.py").read_text(encoding="utf-8")
          async_runtime = Path("control-plane/async_reconcile.py").read_text(encoding="utf-8")
          deferred = Path("control-plane/deferred_poll.py").read_text(encoding="utf-8")
          reconcile_runtime = Path("control-plane/deferred_reconcile.py").read_text(encoding="utf-8")
          health_runtime = Path("security/governance_health_check.py").read_text(encoding="utf-8")
          canary_runtime = Path("security/gpts_ingress_canary.py").read_text(encoding="utf-8")
          guard = Path("security/governance_issue_guard.py").read_text(encoding="utf-8")
          status_dictionary = Path("control-plane/status-dictionary.json").read_text(encoding="utf-8")

          required_openapi = (
              "openapi: 3.1.0", "version: 4.1.0",
              "operationId: checkGovernanceGatewayPublic", "operationId: checkGitHubAuthentication",
              "operationId: submitDecisionTask", "operationId: findDecisionTaskByClientRequestId",
              "operationId: getDecisionTaskStatus", "operationId: getDecisionTaskReceipts",
              "x-openai-isConsequential: true", "x-openai-isConsequential: false", "security: []",
              "/issues/{issue_number}/comments:", "github-actions[bot]",
              "governance-control-ticket-v4", "client_request_id", "read-after-write",
              '"inputs":{"data":[1,2,3]}',
          )
          missing = [item for item in required_openapi if item not in openapi]
          if missing: raise SystemExit(f"OpenAPI required entries missing: {missing}")

          required_workflow = (
              "issues:", "types: [opened]", "workflow_dispatch:", 'cron: "*/15 * * * *"',
              "actions: write", "group: governance-control-global-worker",
              "cancel-in-progress: false", "resilient_control.py select", "resilient_control.py prepare",
              "governance_issue_guard.py", "resilient_control.py pending",
              "GOVERNANCE_HTTP_AUDIT_FILE", "GOVERNANCE_HTTP_MAX_ATTEMPTS",
              "Record asynchronous handoff", "runner_held_waiting", "poll_owner",
              "terminal collection is delegated to asynchronous reconciliation",
              "Wake next FIFO worker with bounded retry", "delays=(0 5 15)",
              "CONTROL_QUEUE_WAKE_DEGRADED", "15-minute scheduled worker",
              "--phase duplicate", "--phase running", "-f state_reason=duplicate",
              "gh workflow run control-plane-ticket.yml --ref main",
          )
          missing = [item for item in required_workflow if item not in workflow]
          if missing: raise SystemExit(f"serial queue workflow entries missing: {missing}")
          if "python control-plane/control_plane.py" in workflow:
              raise SystemExit("direct non-resilient control entrypoint remains")
          if "deferred_poll.py" in workflow or "steps.monitor" in workflow:
              raise SystemExit("dispatch workflow must not hold a Runner for child polling")

          required_ingress = (
              "GPTs Ingress Acknowledgement", "issues:", "types: [opened]",
              "gpts-ingress-${{ github.event.issue.number }}", "cancel-in-progress: false",
              "ingress_ack.py", "GITHUB_TOKEN:", "persist-credentials: false",
          )
          missing = [item for item in required_ingress if item not in ingress_workflow]
          if missing: raise SystemExit(f"ingress acknowledgement entries missing: {missing}")

          required_canary = (
              "GPTs Ingress Canary", 'cron: "17 */6 * * *"',
              "gpts_ingress_canary.py", "issues: write", "persist-credentials: false",
          )
          missing = [item for item in required_canary if item not in canary_workflow]
          if missing: raise SystemExit(f"ingress canary entries missing: {missing}")

          required_reconcile = (
              "Governance Async Terminal Reconciliation", 'cron: "*/5 * * * *"',
              "group: governance-control-global-worker", "async_reconcile.py",
              "deferred_reconcile.py", "CONTROL_PLANE_TOKEN:",
              "persist-credentials: false",
          )
          missing = [item for item in required_reconcile if item not in reconcile]
          if missing: raise SystemExit(f"reconcile workflow entries missing: {missing}")
          if reconcile.count("CONTROL_PLANE_TOKEN:") != 2:
              raise SystemExit("async reconcile workflow must isolate two child-token step scopes")

          required_runtime = (
              "MAX_EXECUTION_ATTEMPTS = 3", "MAX_COMMENT_SCAN_PAGES = 10",
              "MAX_JSON_DEPTH = 32", "MAX_JSON_NODES = 5_000",
              "def _request_fingerprint(", "def _duplicate_blocks(", "def _list_comments(",
              "def _artifact_contract_error(", "CONTROL_CHILD_TASK_MISMATCH",
              "CONTROL_CHILD_EVIDENCE_INVALID", "def _perform_one_recovery(", "def reconcile(",
              "CONTROL_RECONCILED_LATE_SUCCESS", "CONTROL_RECONCILED_LATE_FAILURE",
              "def select(", "def pending(", "in_flight",
              'choices=["duplicate", "exhausted", "running", "rejected", "dispatched", "final"]',
          )
          missing = [item for item in required_runtime if item not in runtime]
          if missing: raise SystemExit(f"P0 runtime entries missing: {missing}")

          required_reliability = (
              'V4 = "governance-control-ticket-v4"', "CLIENT_REQUEST_ID_RE",
              "def _client_request_id(", "def _prior_with_request_id(",
              "REQUEST_ID_CONFLICT", "DUPLICATE_REUSED", "TARGET_NOT_READY",
              "governance-machine-status-v1", "target_preflight_verified",
          )
          missing = [item for item in required_reliability if item not in reliability]
          if missing: raise SystemExit(f"GPTs reliability adapter entries missing: {missing}")

          required_ingress_runtime = (
              "CONTROL_RECEIVED", "read_after_write_verified", "client_request_id",
              "governance-machine-status-v1", "external_business_data_calls",
          )
          missing = [item for item in required_ingress_runtime if item not in ingress_runtime]
          if missing: raise SystemExit(f"ingress acknowledgement runtime entries missing: {missing}")

          required_async_runtime = (
              "POLL_INTERVAL_SECONDS = 300", "RECOVERY_AFTER_SECONDS = 900",
              "ROUTE_DEADLINES", "def candidate(", "def render_terminal(",
              "def render_deadline(", "def _wake_next(", "ASYNC_WAITING",
              "CONTROL_ASYNC_DEADLINE_EXCEEDED",
              "CONTROL._trusted_terminal = DEFERRED.trusted_terminal",
              "CONTROL._github_request = HTTP.github_request",
              "Runner-held waiting: `false`",
          )
          missing = [item for item in required_async_runtime if item not in async_runtime]
          if missing: raise SystemExit(f"asynchronous reconciliation entries missing: {missing}")

          required_resilient_http = (
              "RETRYABLE_HTTP = {429, 502, 503, 504}", "X-RateLimit-Reset",
              "X-RateLimit-Remaining", "Retry-After", "MAX_BACKOFF_SECONDS = 120",
              "def github_request(", "request-retry", "network-retry",
          )
          missing = [item for item in required_resilient_http if item not in resilient_http]
          if missing: raise SystemExit(f"resilient HTTP entries missing: {missing}")
          if "Authorization" not in resilient_http or "token" not in resilient_http:
              raise SystemExit("resilient HTTP authentication contract missing")

          required_resilient_control = (
              "CONTROL._github_request = HTTP.github_request", "RELIABILITY.patch(CONTROL)",
              "CONTROL.parser().parse_args()",
          )
          missing = [item for item in required_resilient_control if item not in resilient_control]
          if missing: raise SystemExit(f"resilient control entries missing: {missing}")

          required_deferred = (
              "def trusted_terminal(", "missing/mismatched Task ID", "incomplete success",
              "CONTROL._github_request = HTTP.github_request", "CONTROL.poll(args)",
          )
          missing = [item for item in required_deferred if item not in deferred]
          if missing: raise SystemExit(f"deferred terminal validator entries missing: {missing}")

          required_reconcile_runtime = (
              "def reconciliation_candidate(", "CONTROL._is_owned_control_issue",
              "CONTROL._generated_task_id", 'CONTROL.ROUTES[route]["repository"]',
              "CONTROL._trusted_terminal = DEFERRED.trusted_terminal",
              "CONTROL._github_request = HTTP.github_request",
          )
          missing = [item for item in required_reconcile_runtime if item not in reconcile_runtime]
          if missing: raise SystemExit(f"identity-hardened late reconciliation entries missing: {missing}")

          required_health_workflow = (
              "Governance Token and Repository Health", 'cron: "23 * * * *"',
              "governance_health_check.py", "Reconcile single health Issue",
              "[health] Governance Control Plane", "CONTROL_PLANE_TOKEN:",
              "External business data calls: `0`", "Secret values recorded: `false`",
          )
          missing = [item for item in required_health_workflow if item not in health_workflow]
          if missing: raise SystemExit(f"health workflow entries missing: {missing}")
          if health_workflow.count("CONTROL_PLANE_TOKEN:") != 1:
              raise SystemExit("health workflow must reference CONTROL_PLANE_TOKEN exactly once")

          required_health_runtime = (
              "a15280020511/decision-system-governance",
              "a15280020511/evidence-data-center",
              "a15280020511/compute-simulation-center",
              "a15280020511/expert-assessment-center",
              "/contents", "/actions/secrets", '"secret_values_recorded": False',
              '"model_calls": 0', '"external_business_data_calls": 0',
          )
          missing = [item for item in required_health_runtime if item not in health_runtime]
          if missing: raise SystemExit(f"health runtime entries missing: {missing}")

          required_canary_runtime = (
              "GPTS_INGRESS_CANARY", "read_after_write_verified",
              "business_dispatch", '"model_calls": 0',
              '"external_business_data_calls": 0',
          )
          missing = [item for item in required_canary_runtime if item not in canary_runtime]
          if missing: raise SystemExit(f"ingress canary runtime entries missing: {missing}")

          required_guard = (
              'TRUSTED_AUTHOR = "github-actions[bot]"', "MAX_COMMENT_PAGES = 10",
              "def _fetch_paginated_comments(", "CONTROL_RECONCILED_LATE_SUCCESS",
              "untrusted governance status block is forbidden",
              "does not match the latest trusted bot receipt",
          )
          missing = [item for item in required_guard if item not in guard]
          if missing: raise SystemExit(f"governance status guard entries missing: {missing}")

          required_statuses = (
              '"RECEIVED"', '"SUBMISSION_AMBIGUOUS"', '"DUPLICATE_REUSED"',
              '"REQUEST_ID_CONFLICT"', '"TARGET_NOT_READY"',
              '"CONTROL_COMPLETED"', '"CONTROL_FAILED"', '"CONTROL_TIMEOUT"',
              '"CONTROL_MONITOR_ERROR"', '"CONTROL_ASYNC_DEADLINE_EXCEEDED"',
              '"CONTROL_RECONCILED_LATE_SUCCESS"', '"CONTROL_RECONCILED_LATE_FAILURE"',
              '"CONTROL_QUEUE_WAKE_DEGRADED"', '"PLATFORM_UNAVAILABLE"', '"next_action"',
          )
          missing = [item for item in required_statuses if item not in status_dictionary]
          if missing: raise SystemExit(f"status dictionary entries missing: {missing}")

          forbidden = (
              "commentGovernanceIssue", "/dispatch-control", "issue_comment:",
              "governance-control-ticket-v1", "governance-control-ticket-v2",
              '"inputs":{"values":', "cancel-in-progress: true",
          )
          found = [item for item in forbidden if item in openapi or item in workflow]
          if found: raise SystemExit(f"legacy or unsafe interface content remains: {found}")
          if openapi.count("operationId:") != 6: raise SystemExit("GPT Action must expose exactly six operations")
          if openapi.count("x-openai-isConsequential: true") != 1: raise SystemExit("exactly one write operation must require confirmation")
          if openapi.count("x-openai-isConsequential: false") != 5: raise SystemExit("all five read operations must be non-consequential")
          if workflow.count("group: governance-control-global-worker") != 1: raise SystemExit("dispatch workflow must expose exactly one global execution slot")
          if reconcile.count("group: governance-control-global-worker") != 1: raise SystemExit("reconcile workflow must share exactly one global execution slot")
          if runtime.count("hashlib.sha256") != 1: raise SystemExit("legacy request identity must use one canonical SHA-256 path")
          PY
