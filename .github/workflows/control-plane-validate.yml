name: Control Plane Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Compile control plane
        run: python -m py_compile control-plane/control_plane.py
      - name: Run deterministic control-plane tests
        run: python -m unittest discover -s tests -p 'test_control_plane.py' -v
      - name: Validate disabled ServerChan installation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("integrations/serverchan/integration.json").read_text(encoding="utf-8")
          )
          expected = {
              "id": "serverchan",
              "installation_status": "installed",
              "activation_status": "disabled",
              "implementation_status": "not_designed",
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"ServerChan installation field mismatch: {key}")
          for key in ("runtime_entrypoints", "required_secrets", "network_endpoints"):
              if data.get(key) != []:
                  raise SystemExit(f"ServerChan must have no active {key}")
          PY
      - name: Validate one-step GPT Action contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          openapi = Path("gpts-action/openapi.yaml").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/control-plane-ticket.yml").read_text(
              encoding="utf-8"
          )
          schema = json.loads(
              Path("control-plane/control-ticket.schema.json").read_text(encoding="utf-8")
          )
          required = (
              "openapi: 3.1.0",
              "operationId: submitDecisionTask",
              "operationId: getDecisionTaskStatus",
              "operationId: getDecisionTaskReceipts",
              "governance-control-ticket-v3",
          )
          missing = [item for item in required if item not in openapi]
          if missing:
              raise SystemExit(f"OpenAPI required entries missing: {missing}")
          forbidden = (
              "commentGovernanceIssue",
              "/dispatch-control",
              "issue_comment:",
              "governance-control-ticket-v1",
              "governance-control-ticket-v2",
          )
          found = [item for item in forbidden if item in openapi or item in workflow]
          if found:
              raise SystemExit(f"legacy two-step interface remains: {found}")
          if workflow.count("issues:") != 1 or "types: [opened]" not in workflow:
              raise SystemExit("control workflow must trigger exactly on Issue opened")
          if openapi.count("operationId:") != 3:
              raise SystemExit("GPT Action must expose exactly three operations")
          version = schema["properties"]["schema_version"]["const"]
          if version != "governance-control-ticket-v3":
              raise SystemExit("control schema version mismatch")
          PY
