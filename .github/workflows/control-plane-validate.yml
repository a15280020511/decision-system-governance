name: Control Plane Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile control plane
        run: python -m py_compile control-plane/control_plane.py control-plane/serverchan_notify.py
      - name: Run deterministic control-plane tests
        run: python -m unittest discover -s tests -p 'test_control_plane.py' -v
      - name: Validate GPT Action OpenAPI
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("gpts-action/openapi.yaml").read_text(encoding="utf-8")
          required = (
              "openapi: 3.1.0",
              "operationId: createGovernanceIssue",
              "operationId: commentGovernanceIssue",
              "operationId: getGovernanceIssue",
              "operationId: listGovernanceIssueComments",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"OpenAPI required entries missing: {missing}")
          PY
