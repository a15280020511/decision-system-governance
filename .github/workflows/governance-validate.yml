name: Governance Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          forbidden = {'api-center', 'compute-center', 'open-model-market'}
          present = sorted(name for name in forbidden if Path(name).exists())
          if present:
              raise SystemExit(f'business runtime roots forbidden: {present}')
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          required = [
              'ARCHITECTURE.md', 'THREE_CENTER_CONTRACT.md',
              'MASTER_OPERATIONS_RUNBOOK.md', 'GPTS_REBUILD_GUIDE.md',
              'GLOBAL_RECOVERY_CHECKLIST.md', 'SECURITY_BOUNDARIES.md',
              'INTERFACE_VERSION_MATRIX.json', 'governance-release-manifest.json'
          ]
          missing = [path for path in required if not Path(path).exists()]
          if missing:
              raise SystemExit(f'missing governance files: {missing}')
          PY
