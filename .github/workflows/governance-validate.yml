name: Governance Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate governance boundary and release manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          forbidden = {"api-center", "compute-center", "open-model-market"}
          present = sorted(name for name in forbidden if Path(name).exists())
          if present:
              raise SystemExit(f"business runtime roots forbidden: {present}")

          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))

          required = {
              "ARCHITECTURE.md",
              "THREE_CENTER_CONTRACT.md",
              "MASTER_OPERATIONS_RUNBOOK.md",
              "GPTS_REBUILD_GUIDE.md",
              "GLOBAL_RECOVERY_CHECKLIST.md",
              "SECURITY_BOUNDARIES.md",
              "INTERFACE_VERSION_MATRIX.json",
              "SYSTEMS_COMPUTATION_MATRIX_POLICY.md",
              "governance-release-manifest.json",
          }
          missing = sorted(path for path in required if not Path(path).exists())
          if missing:
              raise SystemExit(f"missing governance files: {missing}")

          manifest_path = Path("governance-release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          rows = manifest.get("files")
          if not isinstance(rows, list):
              raise SystemExit("release manifest files must be an array")

          listed = {}
          for row in rows:
              path = str(row.get("path") or "")
              if not path or path in listed:
                  raise SystemExit(f"invalid or duplicate manifest path: {path}")
              listed[path] = row

          actual_paths = sorted(
              path.as_posix()
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.as_posix() != manifest_path.as_posix()
          )
          if sorted(listed) != actual_paths:
              missing_rows = sorted(set(actual_paths) - set(listed))
              stale_rows = sorted(set(listed) - set(actual_paths))
              raise SystemExit(
                  f"release manifest path mismatch: missing={missing_rows} stale={stale_rows}"
              )

          total_bytes = 0
          for relative in actual_paths:
              path = Path(relative)
              data = path.read_bytes()
              size = len(data)
              digest = hashlib.sha256(data).hexdigest()
              row = listed[relative]
              if row.get("size_bytes") != size or row.get("sha256") != digest:
                  raise SystemExit(
                      f"release manifest digest mismatch: {relative} "
                      f"size={size} sha256={digest}"
                  )
              total_bytes += size

          if manifest.get("file_count") != len(actual_paths):
              raise SystemExit("release manifest file_count mismatch")
          if manifest.get("total_bytes") != total_bytes:
              raise SystemExit(
                  f"release manifest total_bytes mismatch: "
                  f"declared={manifest.get('total_bytes')} actual={total_bytes}"
              )
          print(json.dumps({
              "status": "PASS",
              "file_count": len(actual_paths),
              "total_bytes": total_bytes,
          }))
          PY
