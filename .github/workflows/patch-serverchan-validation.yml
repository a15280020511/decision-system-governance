name: Patch ServerChan Validation

on:
  push:
    branches:
      - upgrade/security-observability-20260805
    paths:
      - .github/workflows/patch-serverchan-validation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: upgrade/security-observability-20260805
          persist-credentials: true

      - name: Apply and commit one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_serverchan_validation.py
          rm tools/patch_serverchan_validation.py
          rm .github/workflows/patch-serverchan-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/control-plane-validate.yml
          git add -u .github/workflows/patch-serverchan-validation.yml tools/patch_serverchan_validation.py
          git commit -m "test: validate active governed integrations"
          git push origin HEAD:upgrade/security-observability-20260805
