name: Apply Eight Model Contract Patch

on:
  push:
    branches:
      - fix/eight-model-ordered-recovery-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4504dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/eight-model-ordered-recovery-semantics
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Patch governance validation contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch target in {path}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          signer_old = '''    rows = [*selected, *recovery]
              companies: set[str] = set()
              models: set[str] = set()
              for index, row in enumerate(rows):
                  if not isinstance(row, Mapping):
                      raise ExpertPlanSigningError(f"plan model row {index} is not an object")
                  model = str(row.get("model") or "").strip()
                  company = str(row.get("company") or "").strip().casefold()
                  provider_count = row.get("qualified_provider_count")
                  endpoint_hash = str(row.get("endpoint_inventory_sha256") or "")
                  evidence = str(row.get("selection_evidence") or "")
                  if not model or model in models:
                      raise ExpertPlanSigningError("expert models are not globally distinct")
                  if not company or company in companies:
                      raise ExpertPlanSigningError("expert companies are not globally distinct")
                  if company in {"openai", "anthropic"}:
                      raise ExpertPlanSigningError(
                          "governance companies cannot be expert companies"
                      )
                  if (
                      isinstance(provider_count, bool)
                      or not isinstance(provider_count, int)
                      or provider_count < TASK_ENVELOPE.MINIMUM_QUALIFIED_PROVIDER_COUNT
                  ):
                      raise ExpertPlanSigningError(
                          "model does not satisfy the qualified provider redundancy floor"
                      )
                  if "authenticated-zdr-endpoint-qualified" not in evidence:
                      raise ExpertPlanSigningError(
                          "model lacks authenticated ZDR selection evidence"
                      )
                  if len(endpoint_hash) != 64 or any(
                      character not in "0123456789abcdef" for character in endpoint_hash
                  ):
                      raise ExpertPlanSigningError("model endpoint inventory hash is invalid")
                  models.add(model)
                  companies.add(company)
          '''
          signer_new = '''    selected_companies: set[str] = set()
              models: set[str] = set()
              for field, rows in (("selected_models", selected), ("recovery_models", recovery)):
                  for index, row in enumerate(rows):
                      if not isinstance(row, Mapping):
                          raise ExpertPlanSigningError(
                              f"{field}[{index}] is not an object"
                          )
                      model = str(row.get("model") or "").strip()
                      company = str(row.get("company") or "").strip().casefold()
                      provider_count = row.get("qualified_provider_count")
                      endpoint_hash = str(row.get("endpoint_inventory_sha256") or "")
                      evidence = str(row.get("selection_evidence") or "")
                      if not model or model in models:
                          raise ExpertPlanSigningError(
                              "expert models are not globally distinct"
                          )
                      if not company:
                          raise ExpertPlanSigningError("expert model company is missing")
                      if field == "selected_models" and company in selected_companies:
                          raise ExpertPlanSigningError(
                              "selected expert companies are not distinct"
                          )
                      if company in {"openai", "anthropic"}:
                          raise ExpertPlanSigningError(
                              "governance companies cannot be expert companies"
                          )
                      if (
                          isinstance(provider_count, bool)
                          or not isinstance(provider_count, int)
                          or provider_count < TASK_ENVELOPE.MINIMUM_QUALIFIED_PROVIDER_COUNT
                      ):
                          raise ExpertPlanSigningError(
                              "model does not satisfy the qualified provider redundancy floor"
                          )
                      if "authenticated-zdr-endpoint-qualified" not in evidence:
                          raise ExpertPlanSigningError(
                              "model lacks authenticated ZDR selection evidence"
                          )
                      if len(endpoint_hash) != 64 or any(
                          character not in "0123456789abcdef"
                          for character in endpoint_hash
                      ):
                          raise ExpertPlanSigningError(
                              "model endpoint inventory hash is invalid"
                          )
                      models.add(model)
                      if field == "selected_models":
                          selected_companies.add(company)
          '''
          replace_once('tools/sign_expert_plan.py', signer_old, signer_new)

          repair_old = '''    rows = [
                  *list(plan.get("selected_models") or []),
                  *list(plan.get("recovery_models") or []),
              ]
              companies: set[str] = set()
              models: set[str] = set()
              for index, row in enumerate(rows):
                  if not isinstance(row, Mapping):
                      raise ExpertChildRepairError(f"plan model row {index} is not an object")
                  model = str(row.get("model") or "").strip()
                  company = str(row.get("company") or "").strip().casefold()
                  endpoint_hash = str(row.get("endpoint_inventory_sha256") or "")
                  provider_count = row.get("qualified_provider_count")
                  if not model or model in models:
                      raise ExpertChildRepairError("regenerated plan contains duplicate model")
                  if not company or company in companies:
                      raise ExpertChildRepairError("regenerated plan reuses a model company")
                  if company in {"openai", "anthropic"}:
                      raise ExpertChildRepairError("regenerated plan contains governance company")
                  if (
                      isinstance(provider_count, bool)
                      or not isinstance(provider_count, int)
                      or provider_count < TASK_ENVELOPE.MINIMUM_QUALIFIED_PROVIDER_COUNT
                  ):
                      raise ExpertChildRepairError(
                          "model does not satisfy the qualified provider redundancy floor"
                      )
                  if len(endpoint_hash) != 64 or any(
                      character not in "0123456789abcdef" for character in endpoint_hash
                  ):
                      raise ExpertChildRepairError("model endpoint inventory hash is invalid")
                  models.add(model)
                  companies.add(company)
          '''
          repair_new = '''    selected_rows = list(plan.get("selected_models") or [])
              recovery_rows = list(plan.get("recovery_models") or [])
              selected_companies: set[str] = set()
              models: set[str] = set()
              for field, rows in (
                  ("selected_models", selected_rows),
                  ("recovery_models", recovery_rows),
              ):
                  for index, row in enumerate(rows):
                      if not isinstance(row, Mapping):
                          raise ExpertChildRepairError(
                              f"{field}[{index}] is not an object"
                          )
                      model = str(row.get("model") or "").strip()
                      company = str(row.get("company") or "").strip().casefold()
                      endpoint_hash = str(row.get("endpoint_inventory_sha256") or "")
                      provider_count = row.get("qualified_provider_count")
                      if not model or model in models:
                          raise ExpertChildRepairError(
                              "regenerated plan contains duplicate model"
                          )
                      if not company:
                          raise ExpertChildRepairError(
                              "regenerated plan model company is missing"
                          )
                      if field == "selected_models" and company in selected_companies:
                          raise ExpertChildRepairError(
                              "regenerated primary plan reuses a model company"
                          )
                      if company in {"openai", "anthropic"}:
                          raise ExpertChildRepairError(
                              "regenerated plan contains governance company"
                          )
                      if (
                          isinstance(provider_count, bool)
                          or not isinstance(provider_count, int)
                          or provider_count < TASK_ENVELOPE.MINIMUM_QUALIFIED_PROVIDER_COUNT
                      ):
                          raise ExpertChildRepairError(
                              "model does not satisfy the qualified provider redundancy floor"
                          )
                      if len(endpoint_hash) != 64 or any(
                          character not in "0123456789abcdef"
                          for character in endpoint_hash
                      ):
                          raise ExpertChildRepairError(
                              "model endpoint inventory hash is invalid"
                          )
                      models.add(model)
                      if field == "selected_models":
                          selected_companies.add(company)
          '''
          replace_once('tools/repair_expert_child_plan.py', repair_old, repair_new)

          envelope = Path('governance-copilot/expert_task_envelope.py')
          text = envelope.read_text(encoding='utf-8')
          replacements = {
              'SCHEMA_VERSION = "governance-expert-task-envelope-v5"':
                  'SCHEMA_VERSION = "governance-expert-task-envelope-v6"',
              'governance-openrouter-zdr-redundant-executable-flagship-price-v5':
                  'governance-openrouter-zdr-redundant-executable-flagship-price-v6',
              'distinct-company, price-ranked standby models':
                  'price-ranked, model-distinct standby models',
              'price-ascending -> distinct-model-companies':
                  'price-ascending -> distinct-primary-companies -> unique-recovery-models',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing envelope target: {old}')
              text = text.replace(old, new)
          envelope.write_text(text, encoding='utf-8')

          preview_test = Path('tests/test_expert_plan_preview_workflow.py')
          text = preview_test.read_text(encoding='utf-8')
          text = text.replace(
              '"expert companies are not globally distinct",',
              '"selected expert companies are not distinct",',
          )
          preview_test.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched contracts
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance-copilot/expert_task_envelope.py tools/sign_expert_plan.py tools/repair_expert_child_plan.py tests/test_expert_plan_preview_workflow.py
          git commit -m 'fix: allow company reuse only in ordered recovery models'
          git push origin HEAD:fix/eight-model-ordered-recovery-semantics
