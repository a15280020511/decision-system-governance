name: Governance PRC Justice Encrypted Transport

on:
  schedule:
    - cron: "17 * * * *"
  issues:
    types: [opened, reopened]
  pull_request:
    branches: [main]
    paths:
      - "hf-justice-intelligence-gateway/encrypted_transport.py"
      - "hf-justice-intelligence-gateway/tests/test_encrypted_transport.py"
      - "hf-justice-intelligence-gateway/requirements.txt"
      - ".github/workflows/hf-justice-encrypted-transport.yml"
  push:
    branches: [main]
    paths:
      - "hf-justice-intelligence-gateway/encrypted_transport.py"
      - "hf-justice-intelligence-gateway/tests/test_encrypted_transport.py"
      - "hf-justice-intelligence-gateway/requirements.txt"
      - ".github/workflows/hf-justice-encrypted-transport.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-hf-justice-encrypted-transport
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == '[hf-justice-poll]' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-justice-intelligence-gateway/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r hf-justice-intelligence-gateway/requirements.txt
          python -m pip check

      - name: Validate encrypted transport without secrets or network
        env:
          HF_TOKEN: ""
          CONTROL_PLANE_TOKEN: ""
        run: |
          set -euo pipefail
          python -m py_compile \
            hf-justice-intelligence-gateway/gateway.py \
            hf-justice-intelligence-gateway/encrypted_transport.py
          python -m unittest hf-justice-intelligence-gateway/tests/test_encrypted_transport.py -v
          python hf-justice-intelligence-gateway/encrypted_transport.py validate | tee hf-justice-encrypted-transport-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('hf-justice-encrypted-transport-validation.json').read_text(encoding='utf-8'))
          assert row['status'] == 'HF_JUSTICE_ENCRYPTED_TRANSPORT_VALIDATED'
          assert row['plaintext_issue_transport'] is False
          assert row['control_plane_actions_permission_required'] is False
          assert row['control_plane_contents_permission_required'] is False
          assert row['model_calls'] == 0
          assert row['network_used'] is False
          PY
          git diff --check

      - name: Upload validation evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-hf-justice-encrypted-validation-${{ github.run_id }}
          path: hf-justice-encrypted-transport-validation.json
          if-no-files-found: error
          retention-days: 30

  transport:
    if: >-
      github.event_name != 'pull_request' &&
      needs.validate.result == 'success'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_JUSTICE_INTELLIGENCE_DATASET_REPO: ${{ vars.HF_JUSTICE_INTELLIGENCE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-justice-intelligence-gateway/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r hf-justice-intelligence-gateway/requirements.txt
          python -m pip check

      - name: Publish or refresh current transport public key
        run: |
          set -euo pipefail
          python hf-justice-intelligence-gateway/encrypted_transport.py publish-key | tee hf-justice-key-publication.json

      - name: Poll encrypted Evidence Center handoffs and ingest
        id: poll
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf hf-justice-encrypted-run
          python hf-justice-intelligence-gateway/encrypted_transport.py poll \
            --output-dir hf-justice-encrypted-run | tee hf-justice-encrypted-poll.json

      - name: Render safe transport summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' > hf-justice-encrypted-summary.md
          import json
          from pathlib import Path
          path = Path('hf-justice-encrypted-run/transport-poll-receipt.json')
          row = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {
              'status': 'HF_JUSTICE_ENCRYPTED_POLL_FAILED_BEFORE_RECEIPT',
              'candidate_count': 0, 'processed_count': 0, 'failed_count': 0
          }
          print('## GOVERNANCE_HF_JUSTICE_ENCRYPTED_TRANSPORT')
          print()
          print(f"- Status: `{row.get('status')}`")
          print(f"- Candidate handoffs: `{row.get('candidate_count', 0)}`")
          print(f"- Ingested handoffs: `{row.get('processed_count', 0)}`")
          print(f"- Failed handoffs: `{row.get('failed_count', 0)}`")
          print('- GitHub cross-repo Actions permission required: `false`')
          print('- GitHub cross-repo Contents permission required: `false`')
          print('- Plaintext Issue transport: `false`')
          print('- HF Dataset: `private`')
          print('- Raw source text stored: `false`')
          print('- Raw source URL stored: `false`')
          print('- Raw model response stored: `false`')
          print('- Model calls in transport: `0`')
          PY
          cat hf-justice-encrypted-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe governance transport receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-hf-justice-encrypted-${{ github.run_id }}
          path: |
            hf-justice-key-publication.json
            hf-justice-encrypted-run/*.json
            hf-justice-encrypted-poll.json
            hf-justice-encrypted-summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Fail closed on transport error
        if: always() && steps.poll.outcome != 'success'
        run: exit 1
