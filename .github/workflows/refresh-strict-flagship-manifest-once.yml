name: Refresh Strict Flagship Manifest Once

on:
  push:
    branches:
      - fix/strict-flagship-price-order

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/strict-flagship-price-order
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate exact manifest without transient files
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          workflow='.github/workflows/refresh-strict-flagship-manifest-once.yml'
          mv "$workflow" /tmp/refresh-strict-flagship-manifest-once.yml
          python tools/generate_governance_release_manifest.py \
            --root . \
            --output governance-release-manifest.json \
            --version 4.2.3
          mv /tmp/refresh-strict-flagship-manifest-once.yml "$workflow"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance-release-manifest.json
          git commit -m "fix: refresh strict flagship release manifest"
          git push origin HEAD:fix/strict-flagship-price-order
