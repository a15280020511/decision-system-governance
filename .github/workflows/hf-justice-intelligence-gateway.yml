name: Governance PRC Justice Hugging Face Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - "hf-justice-intelligence-gateway/**"
      - ".github/workflows/hf-justice-intelligence-gateway.yml"
      - "SECURITY_BOUNDARIES.md"
  push:
    branches: [main]
    paths:
      - "hf-justice-intelligence-gateway/**"
      - ".github/workflows/hf-justice-intelligence-gateway.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Justice intelligence HF gateway operation
        required: true
        type: choice
        options: [health, bootstrap]
        default: health

permissions:
  contents: read

concurrency:
  group: governance-hf-justice-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-justice-intelligence-gateway/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r hf-justice-intelligence-gateway/requirements.txt
          python -m pip check

      - name: Compile test and validate contract
        env:
          HF_TOKEN: ""
          HF_JUSTICE_INTELLIGENCE_DATASET_REPO: ""
        run: |
          set -euo pipefail
          python -m py_compile \
            hf-justice-intelligence-gateway/gateway.py \
            hf-justice-intelligence-gateway/query_report.py \
            hf-justice-intelligence-gateway/encrypted_transport.py
          python -m unittest discover -s hf-justice-intelligence-gateway/tests -p 'test_*.py' -v
          python hf-justice-intelligence-gateway/gateway.py validate --output-dir hf-justice-validation
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('hf-justice-validation/receipt.json').read_text(encoding='utf-8'))
          assert row['status'] == 'HF_JUSTICE_INTELLIGENCE_CONTRACT_VALIDATED'
          assert row['secret_values_exposed'] is False
          assert row['model_calls'] == 0
          PY
          git diff --check

      - name: Upload validation evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-hf-justice-validation-${{ github.run_id }}
          path: hf-justice-validation/
          if-no-files-found: error
          retention-days: 30

  execute-health-or-bootstrap:
    if: github.event_name == 'workflow_dispatch' && needs.validate.result == 'success'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_JUSTICE_INTELLIGENCE_DATASET_REPO: ${{ vars.HF_JUSTICE_INTELLIGENCE_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-justice-intelligence-gateway/requirements.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r hf-justice-intelligence-gateway/requirements.txt
          python -m pip check

      - name: Run governed HF maintenance operation
        run: |
          set -euo pipefail
          python hf-justice-intelligence-gateway/gateway.py "${{ inputs.operation }}" --output-dir hf-justice-run
          python hf-justice-intelligence-gateway/gateway.py render --output-dir hf-justice-run | tee hf-justice-summary.md
          cat hf-justice-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe governance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-hf-justice-${{ github.run_id }}
          path: |
            hf-justice-run/*.json
            hf-justice-summary.md
          if-no-files-found: error
          retention-days: 90
