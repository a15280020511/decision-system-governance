name: Governance Control Plane

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: governance-control-global-worker
  cancel-in-progress: false

jobs:
  serial-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOVERNANCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GOVERNANCE_HTTP_AUDIT_FILE: control-artifacts/http-retry-audit.jsonl
      GOVERNANCE_HTTP_MAX_ATTEMPTS: "4"
    steps:
      - name: Checkout governance control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Select oldest queued governance task
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python control-plane/resilient_control.py select \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir control-artifacts

      - name: Report queue or asynchronous in-flight state
        if: steps.select.outputs.has_task != 'true'
        env:
          IN_FLIGHT: ${{ steps.select.outputs.in_flight || 'false' }}
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number || '' }}
        run: |
          if [ "$IN_FLIGHT" = "true" ]; then
            echo "Governance Issue #${ISSUE_NUMBER} is asynchronously waiting; no Runner is held."
          else
            echo "No owned open [control] Issue is waiting."
          fi

      - name: Parse and validate selected ticket before classification
        id: prepare
        if: steps.select.outputs.has_task == 'true'
        continue-on-error: true
        run: |
          python control-plane/resilient_control.py prepare \
            --event-path control-artifacts/selected-event.json \
            --output-dir control-artifacts

      - name: Verify governance status ownership
        id: status_guard
        if: steps.select.outputs.has_task == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            --jq '.body // ""' > control-artifacts/raw-issue-body.md
          gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments?per_page=100" \
            > control-artifacts/governance-comments.json
          python security/governance_issue_guard.py \
            --raw-body control-artifacts/raw-issue-body.md \
            --comments-json control-artifacts/governance-comments.json \
            --prepare-status control-artifacts/prepare-status.json

      - name: Publish rejected governance ticket
        if: >-
          steps.select.outputs.has_task == 'true' &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.status_guard.outputs.safe != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          python control-plane/resilient_control.py render \
            --phase rejected \
            --output-dir control-artifacts \
            --output governance-comment.md
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md \
            -f state=closed \
            -f state_reason=not_planned
          touch control-artifacts/task-handled

      - name: Reject duplicate submission
        if: >-
          steps.select.outputs.has_task == 'true' &&
          steps.prepare.outputs.accepted == 'true' &&
          steps.status_guard.outputs.safe == 'true' &&
          steps.select.outputs.duplicate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          python control-plane/resilient_control.py render \
            --phase duplicate \
            --output-dir control-artifacts \
            --output governance-comment.md
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md \
            -f state=closed \
            -f state_reason=duplicate
          touch control-artifacts/task-handled

      - name: Close bounded-retry exhaustion
        if: >-
          steps.select.outputs.has_task == 'true' &&
          steps.prepare.outputs.accepted == 'true' &&
          steps.status_guard.outputs.safe == 'true' &&
          steps.select.outputs.duplicate != 'true' &&
          steps.select.outputs.retry_exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          python control-plane/resilient_control.py render \
            --phase exhausted \
            --output-dir control-artifacts \
            --output governance-comment.md
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md \
            -f state=closed \
            -f state_reason=not_planned
          touch control-artifacts/task-handled

      - name: Publish global-slot running receipt
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.status_guard.outputs.safe == 'true' &&
          steps.select.outputs.duplicate != 'true' &&
          steps.select.outputs.retry_exhausted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          python control-plane/resilient_control.py render \
            --phase running \
            --output-dir control-artifacts \
            --output governance-comment.md
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md

      - name: Dispatch through the child repository formal Issue entry
        id: dispatch
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.status_guard.outputs.safe == 'true' &&
          steps.select.outputs.duplicate != 'true' &&
          steps.select.outputs.retry_exhausted != 'true'
        continue-on-error: true
        env:
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
        run: |
          python control-plane/resilient_control.py dispatch \
            --output-dir control-artifacts

      - name: Publish dispatch infrastructure failure
        if: steps.dispatch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          cat > governance-comment.md <<'EOF'
          ## CONTROL_FAILED

          - Failure class: `CONTROL_DISPATCH_ERROR`
          - Child center result: `not created or not confirmed`
          - Action: inspect this workflow run; no business success is claimed.
          EOF
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md \
            -f state=closed \
            -f state_reason=not_planned
          touch control-artifacts/task-handled

      - name: Publish child dispatch receipt
        if: steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          python control-plane/resilient_control.py render \
            --phase dispatched \
            --output-dir control-artifacts \
            --output governance-comment.md
          python control-plane/resilient_control.py compose \
            --request control-artifacts/selected-request.md \
            --receipt governance-comment.md \
            --output governance-issue-body.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@governance-comment.md
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}" \
            -F body=@governance-issue-body.md

      - name: Record asynchronous handoff
        if: steps.dispatch.outcome == 'success'
        run: |
          cat > control-artifacts/async-handoff.json <<EOF
          {
            "schema_version": "governance-async-handoff-v1",
            "status": "CONTROL_DISPATCHED",
            "runner_held_waiting": false,
            "poll_owner": "control-plane-reconcile.yml",
            "poll_interval_target_seconds": 300,
            "legacy_wait_seconds_used_for_blocking": false
          }
          EOF

      - name: Upload governance control evidence
        if: always() && steps.select.outputs.has_task == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-control-${{ steps.select.outputs.issue_number }}-${{ github.run_id }}
          path: control-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Check remaining queue
        id: remaining
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f control-artifacts/task-handled ]; then
            python control-plane/resilient_control.py pending \
              --repository "$GITHUB_REPOSITORY"
          else
            echo "has_more=false" >> "$GITHUB_OUTPUT"
            echo "pending_count=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake next FIFO worker with bounded retry
        id: wake
        if: always() && steps.remaining.outputs.has_more == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          delays=(0 5 15)
          for index in "${!delays[@]}"; do
            delay="${delays[$index]}"
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            if gh workflow run control-plane-ticket.yml --ref main; then
              echo "wake_attempt=$((index + 1))" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "wake_attempt=3" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publish queue wake degradation receipt
        if: >-
          always() &&
          steps.remaining.outputs.has_more == 'true' &&
          steps.wake.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
        run: |
          cat > queue-wake-degraded.md <<'EOF'
          ## CONTROL_QUEUE_WAKE_DEGRADED

          - Immediate wake attempts: `3/3 failed`
          - Business result of the handled task: `unchanged`
          - Queue preservation: `open [control] Issues remain authoritative`
          - Automatic fallback: `15-minute scheduled worker`
          - Model/API/compute calls caused by wake retries: `0`
          EOF
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${GOVERNANCE_ISSUE_NUMBER}/comments" \
            -F body=@queue-wake-degraded.md

      - name: Enforce selected task result
        if: always()
        run: |
          if [ "${{ steps.select.outputs.has_task }}" != "true" ]; then
            exit 0
          fi
          if [ "${{ steps.prepare.outputs.accepted }}" != "true" ]; then
            exit 1
          fi
          if [ "${{ steps.status_guard.outputs.safe }}" != "true" ]; then
            exit 1
          fi
          if [ "${{ steps.select.outputs.duplicate }}" = "true" ]; then
            exit 0
          fi
          if [ "${{ steps.select.outputs.retry_exhausted }}" = "true" ]; then
            exit 1
          fi
          if [ "${{ steps.dispatch.outcome }}" != "success" ]; then
            exit 1
          fi
          echo "Dispatch accepted; terminal collection is delegated to asynchronous reconciliation."
