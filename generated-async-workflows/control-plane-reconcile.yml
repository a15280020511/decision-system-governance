name: Governance Async Terminal Reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: governance-control-global-worker
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout governance control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Reconcile oldest open asynchronous task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
          GOVERNANCE_HTTP_AUDIT_FILE: async-reconcile-http-audit.jsonl
          GOVERNANCE_HTTP_MAX_ATTEMPTS: "4"
        run: |
          python control-plane/async_reconcile.py             --repository "$GITHUB_REPOSITORY"
      - name: Reconcile closed late terminal results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
          GOVERNANCE_HTTP_AUDIT_FILE: late-reconcile-http-audit.jsonl
          GOVERNANCE_HTTP_MAX_ATTEMPTS: "4"
        run: |
          python control-plane/deferred_reconcile.py             --repository "$GITHUB_REPOSITORY"
